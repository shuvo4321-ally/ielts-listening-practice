ome time to look at questions eleven to fifteen."},{"p":6000},{"s":"N","t":"Now listen and answer questions eleven to fifteen."},{"s":"G","t":"Good morning, everyone, and welcome to Hillside City Farm. I'm Rosa, and I coordinate the volunteers here. Before we start, I'd like to give you a quick idea of where everything is, so please have a look at the map in your pack."},{"s":"G","t":"We're standing at the main entrance, at the bottom of the map. As you come in through the gate, the shop is immediately on your left. Opposite the shop, on the right, are the toilets."},{"s":"G","t":"If you walk straight up the main path, you'll come to the main yard, which is the round area in the middle. Just off the yard, on the right-hand side as you face the barn, between the yard and the pond, you'll find the café. Volunteers get free tea and coffee there, so you'll get to know it well."},{"s":"G","t":"Now, from the yard, take the path to the left. The area on the left-hand side of that path used to be the herb garden, but it's now our picnic area. The vegetable garden is on the right-hand side of the path, near the far end."},{"s":"G","t":"Straight ahead from the yard is the large barn, where most of the animals sleep at night. The volunteers' room is right next to the barn, on its left as you look at it from the yard. That's where you'll leave your bags and pick up your rota."},{"s":"G","t":"Finally, if you take the path to the right of the yard, the first building you come to, on your left, is the first-aid point. Please don't confuse it with the building at the very end of that path, which is just the storage shed."},{"s":"N","t":"Before you hear the rest of the talk, you have some time to look at questions sixteen to twenty."},{"p":6000},{"s":"N","t":"Now listen and answer questions sixteen to twenty."},{"s":"G","t":"Right, a few practical points. The farm opens to the public at nine. We used to ask volunteers to arrive at eight, but we've found that half past eight gives you plenty of time, so that's what we ask now."},{"s":"G","t":"Please don't give the animals any food yourselves. Feeding is done by staff on a strict schedule. Visitors can buy special food bags at the shop to feed the goats, but not any of the other animals, so do keep an eye on that."},{"s":"G","t":"As for what to bring, you'll need sturdy boots, because we can't let anyone into the animal areas in trainers. Gloves we provide, so don't worry about those. Lunch is free in the café for volunteers, so there's no need to bring anything to eat. The weather up here changes quickly, though, so please always bring a waterproof jacket. Your ID badge will be given to you on your first day."},{"s":"G","t":"Some of you have asked why we've moved to a rota system this year. It's true that it helps the staff to plan their week, but the real reason is that volunteers told us they wanted to try different jobs, rather than doing the same thing every week."},{"s":"G","t":"OK. If there are no questions, let's go and meet the animals."},{"s":"N","t":"That is the end of part two."}],"groups":[{"range":"11–15","layout":"map","map":"FARM","instr":"Label the map below.","limit":"Choose FIVE answers from the map, A–H, and write the correct letter next to questions 11–15.","letters":["A","B","C","D","E","F","G","H"],"qs":[{"n":11,"type":"select","label":"Shop","ans":"A","pat":"p5","ev":["the shop is immediately on your left"],"why":"You enter at the bottom of the map facing up, so 'on your left' is the west side of the main path, next to the gate."},{"n":12,"type":"select","label":"Café","ans":"H","pat":"p5","ev":["between the yard and the pond, you'll find the café"],"why":"Two reference points fix it: off the yard, on the right as you face the barn, and between the yard and the pond."},{"n":13,"type":"select","label":"Vegetable garden","ans":"D","pat":"p5","ev":["The vegetable garden is on the right-hand side of the path, near the far end."],"trap":["it's now our picnic area"],"why":"Walking left (west) from the yard, your right-hand side is the north. C is on the left of that path: the old herb garden, now the picnic area."},{"n":14,"type":"select","label":"Volunteers' room","ans":"E","pat":"p5","ev":["The volunteers' room is right next to the barn, on its left as you look at it from the yard."],"why":"Facing the barn from the yard means facing north, so 'on its left' is the west side of the barn."},{"n":15,"type":"select","label":"First-aid point","ans":"F","pat":"p5","ev":["the first building you come to, on your left, is the first-aid point"],"trap":["which is just the storage shed"],"why":"Walking right (east), your left is the north. The building at the end of the path, G, is the storage shed, and that is the distractor."}]},{"range":"16–20","layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":16,"type":"mcq","stem":"What time are volunteers asked to arrive?","opts":{"A":"8.00 a.m.","B":"8.30 a.m.","C":"9.00 a.m."},"ans":"B","pat":"p6","ev":["half past eight gives you plenty of time"],"trap":["We used to ask volunteers to arrive at eight","The farm opens to the public at nine"],"why":"All three times are mentioned. Eight is the old rule ('used to'), nine is the public opening time. Half past eight is what they ask now."},{"n":17,"type":"mcq","stem":"What does the speaker say about feeding the animals?","opts":{"A":"Volunteers may feed the goats.","B":"Visitors may feed one type of animal.","C":"Animals are fed whenever they seem hungry."},"ans":"B","pat":"p6","ev":["Visitors can buy special food bags at the shop to feed the goats, but not any of the other animals"],"trap":["Please don't give the animals any food yourselves","on a strict schedule"],"why":"Visitors can feed the goats only: one type of animal. Volunteers must not feed them at all (A), and feeding is on a strict schedule (C)."},{"n":[18,19],"type":"multi","stem":"Which TWO things must volunteers bring?","opts":{"A":"a waterproof jacket","B":"a packed lunch","C":"boots","D":"gloves","E":"an ID badge"},"ans":["A","C"],"pat":"p11","ev":["you'll need sturdy boots","please always bring a waterproof jacket"],"trap":["Gloves we provide","Lunch is free in the café for volunteers","Your ID badge will be given to you"],"why":"All five are mentioned. Three are ruled out: gloves are provided, lunch is free, the badge is given to you."},{"n":20,"type":"mcq","stem":"What is the main reason for the new rota system?","opts":{"A":"to reduce costs","B":"to give volunteers more variety","C":"to help staff plan their week"},"ans":"B","pat":"p8","ev":["the real reason is that volunteers told us they wanted to try different jobs"],"trap":["It's true that it helps the staff to plan their week"],"why":"'It's true that… but the real reason is' concedes option C and then gives the answer. The signpost 'the real reason' points straight at it."}]}]},{"n":3,"title":"Part 3","kind":"Discussion · academic","context":"Two students, Tom and Nadia, discuss their research project on food waste.","para":["The trouble was that","So was I, but"],"get":[{"b":"Expectation versus reality, twice.","t":"'I was expecting her to be defensive' and 'I thought vegetables would be the worst' both name the wrong answer first."},{"b":"One decision changes.","t":"Nadia wants to rewrite the recommendations, then agrees to leave them as they are."},{"b":"Choose TWO is decided by agreement and rejection.","t":"'Definitely' and 'loved that idea' are in; 'we can't really recommend that' and 'maybe next year' are out."}],"speakers":{"N":"Narrator","A":"Tom","B":"Nadia"},"lines":[{"s":"N","t":"Part three. You will hear two students, Tom and Nadia, discussing a research project on food waste. First, you have some time to look at questions twenty-one to twenty-four."},{"p":6000},{"s":"N","t":"Now listen and answer questions twenty-one to twenty-four."},{"s":"B","t":"So, Tom, shall we go through the project before we see Doctor Evans tomorrow?"},{"s":"A","t":"Good idea. I think she'll start by asking why we picked food waste, because I know she originally suggested we look at transport."},{"s":"B","t":"She did. But the reason we went for food waste is that we'd both seen how much gets thrown away in the canteen every day."},{"s":"A","t":"Exactly. And there turned out to be very little research on it, which made it more interesting to do."},{"s":"B","t":"Then there was the first survey. We did get a good number of responses, over two hundred."},{"s":"A","t":"Yes, the response rate was fine, and it only took a couple of minutes to fill in. The trouble was that people interpreted the question about portion size in completely different ways."},{"s":"B","t":"Which is why we had to redo it. What about the canteen manager? I was expecting her to be quite defensive, to be honest."},{"s":"A","t":"So was I, but she was really keen on the whole thing. She even offered us the waste figures for the whole term."},{"s":"B","t":"And the results themselves. I thought vegetables would be the worst."},{"s":"A","t":"Me too. But it was actually rice. Nearly a third of everything thrown away."},{"s":"B","t":"That was the real surprise. Bread was high as well, but we'd expected that."},{"s":"N","t":"Before you hear the rest of the discussion, you have some time to look at questions twenty-five to thirty."},{"p":6000},{"s":"N","t":"Now listen and answer questions twenty-five to thirty."},{"s":"A","t":"OK, the report. The introduction's far too long, I think."},{"s":"B","t":"Agreed. Let's cut it down to half a page."},{"s":"A","t":"And the methods section?"},{"s":"B","t":"That needs more detail, especially about how we weighed the waste. Doctor Evans will want to know that."},{"s":"A","t":"Fine, I'll add that. Then the results. Should we keep all the tables in there?"},{"s":"B","t":"There are too many. Let's move the full tables to the appendix and keep the charts in the main text."},{"s":"A","t":"Good. And the recommendations?"},{"s":"B","t":"Honestly, I think we should rewrite them completely."},{"s":"A","t":"Do we need to? Doctor Evans said they were the strongest part of the draft."},{"s":"B","t":"That's true. All right, let's leave them as they are."},{"s":"A","t":"So, which recommendations are we actually making? Smaller portions of rice, definitely."},{"s":"B","t":"Definitely. And displaying the daily waste figures on the screen by the tills. The manager loved that idea."},{"s":"A","t":"What about lowering prices?"},{"s":"B","t":"We can't really recommend that. It isn't our decision, and we have no evidence it would help."},{"s":"A","t":"True. And training the kitchen staff?"},{"s":"B","t":"Maybe next year. We haven't looked into it properly."},{"s":"N","t":"That is the end of part three."}],"groups":[{"range":"21–24","layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":21,"type":"mcq","stem":"Why did Tom and Nadia choose food waste as their topic?","opts":{"A":"Their tutor suggested it.","B":"They had noticed a problem themselves.","C":"There was a lot of existing research on it."},"ans":"B","pat":"p6","ev":["we'd both seen how much gets thrown away in the canteen every day"],"trap":["she originally suggested we look at transport","there turned out to be very little research on it"],"why":"The tutor suggested transport, not food waste, and there was very little research. Both A and C are built from real words in the conversation."},{"n":22,"type":"mcq","stem":"What was the problem with their first survey?","opts":{"A":"Too few people responded.","B":"One question was understood in different ways.","C":"It took too long to complete."},"ans":"B","pat":"p6","ev":["people interpreted the question about portion size in completely different ways"],"trap":["over two hundred","it only took a couple of minutes to fill in"],"why":"A and C are both ruled out before the answer arrives: over two hundred responses, and only a couple of minutes. 'The trouble was' signals the answer."},{"n":23,"type":"mcq","stem":"How did the canteen manager react to the project?","opts":{"A":"She was defensive.","B":"She was enthusiastic.","C":"She was uninterested."},"ans":"B","pat":"p20","ev":["she was really keen on the whole thing"],"trap":["I was expecting her to be quite defensive"],"why":"'Defensive' is what they expected, not what happened. 'Really keen' means enthusiastic."},{"n":24,"type":"mcq","stem":"Which finding surprised them most?","opts":{"A":"the amount of vegetables wasted","B":"the amount of rice wasted","C":"the amount of bread wasted"},"ans":"B","pat":"p20","ev":["But it was actually rice","That was the real surprise"],"trap":["I thought vegetables would be the worst","Bread was high as well, but we'd expected that"],"why":"Vegetables were the expectation, bread was expected too. Only rice is called 'the real surprise'."}]},{"range":"25–28","layout":"match","instr":"What do Tom and Nadia decide to do with each section of their report?","limit":"Choose FOUR answers from the box and write the correct letter, A–E, next to questions 25–28.","optTitle":"Decisions","opts":{"A":"shorten it","B":"add more detail","C":"move part of it to an appendix","D":"rewrite it completely","E":"leave it unchanged"},"qs":[{"n":25,"type":"select","label":"Introduction","ans":"A","pat":"p7","ev":["Let's cut it down to half a page."],"why":"'Cut it down' means shorten it."},{"n":26,"type":"select","label":"Methods","ans":"B","pat":"p7","ev":["That needs more detail, especially about how we weighed the waste."],"why":"Stated almost directly: more detail about weighing the waste."},{"n":27,"type":"select","label":"Results","ans":"C","pat":"p7","ev":["Let's move the full tables to the appendix"],"why":"Only the tables move; the charts stay. So 'part of it' goes to the appendix."},{"n":28,"type":"select","label":"Recommendations","ans":"E","pat":"p12","ev":["let's leave them as they are"],"trap":["I think we should rewrite them completely"],"why":"Nadia first wants to rewrite them (D), then changes her mind. In a discussion the final decision counts, not the first suggestion."}]},{"range":"29–30","layout":"multi","instr":"Choose TWO letters, A–E.","limit":"","qs":[{"n":[29,30],"type":"multi","stem":"Which TWO recommendations will they make in their report?","opts":{"A":"smaller portions of rice","B":"a ban on takeaway containers","C":"displaying daily waste figures","D":"lower prices","E":"training for kitchen staff"},"ans":["A","C"],"pat":"p11","ev":["Smaller portions of rice, definitely.","displaying the daily waste figures"],"trap":["We can't really recommend that.","Maybe next year."],"why":"Listen for agreement ('definitely', 'the manager loved that idea') and rejection ('we can't really recommend that', 'maybe next year'). B is never mentioned."}]}]},{"n":4,"title":"Part 4","kind":"Lecture · academic","context":"A lecturer gives a talk about bioluminescence.","para":["But in fact","that's a misunderstanding","The main problem at the moment is that"],"get":[{"b":"Ten gaps, in order, with no pause.","t":"Read all ten before the lecture starts, and keep your eyes one gap ahead."},{"b":"Four answers follow a rejected idea.","t":"Land before ocean, red before blue, tooth before lure, cost and safety before dim."},{"b":"The notes predict the word type.","t":"'A ___ reaction' needs an adjective; 'make cancer cells ___' needs a verb."}],"speakers":{"N":"Narrator","L":"Lecturer"},"lines":[{"s":"N","t":"Part four. You will hear a lecture about bioluminescence. First, you have some time to look at questions thirty-one to forty."},{"p":8000},{"s":"N","t":"Now listen carefully and answer questions thirty-one to forty."},{"s":"L","t":"Good morning. Today I want to look at bioluminescence, which is simply light produced by living things. The important point is how that light is made. It isn't reflected light, and it isn't heat. It's the result of a chemical reaction that takes place inside the organism itself."},{"s":"L","t":"Where do we find it? You might think of fireflies first, and they're certainly the best-known example on land. But in fact the vast majority of bioluminescent species are found in the ocean. In the deep sea, where there's no sunlight at all, it's thought that around three quarters of animals can produce some kind of light."},{"s":"L","t":"You'll notice that most of this light is blue. There's a good reason for that. Red light disappears very quickly underwater, but blue light travels furthest through water, so blue is simply the most efficient colour to produce."},{"s":"L","t":"So what is it used for? Let's start with defence. Some squid, when they're attacked, release a cloud of glowing ink, which confuses the predator long enough for the squid to escape."},{"s":"L","t":"Light is also used to attract prey. The anglerfish is the famous example. It's often said to have a glowing tooth, but that's a misunderstanding. What it actually has is a glowing lure on the top of its head, which small fish swim towards."},{"s":"L","t":"A third use is communication. On land, fireflies flash in particular patterns in order to find a mate, and each species has its own pattern."},{"s":"L","t":"Finally, and perhaps most cleverly, there's camouflage. Many fish produce light on their underside, their belly, which matches the faint light coming from above. Seen from below, their outline simply disappears."},{"s":"L","t":"Now, why does any of this matter to us? Genes taken from a jellyfish have been used to make cancer cells glow, so that researchers can see exactly how a tumour spreads. And looking further ahead, some scientists hope that glowing trees might one day replace street lighting in parks and quiet roads."},{"s":"L","t":"There is a catch, however. It's not that the technology is too expensive, and safety isn't really a concern. The main problem at the moment is that the light is simply too dim to be useful."},{"s":"N","t":"That is the end of part four."}],"groups":[{"range":"31–40","layout":"notes","instr":"Complete the notes below.","limit":"Write ONE WORD ONLY for each answer.","title":"Bioluminescence","notes":[{"h":"Definition"},{"t":"Light produced by living things as the result of a [[31]] reaction"},{"h":"Where it is found"},{"t":"Best-known example on land: fireflies"},{"t":"Most species live in the [[32]]"},{"t":"Usually blue, because blue light travels furthest through [[33]]"},{"h":"Uses"},{"t":"Defence: some squid release glowing [[34]]"},{"t":"Attracting prey: the anglerfish has a glowing [[35]] on its head"},{"t":"Communication: fireflies flash in patterns to find a [[36]]"},{"t":"Camouflage: light on the fish's [[37]] matches light from above"},{"h":"Applications"},{"t":"Jellyfish genes are used to make cancer cells [[38]]"},{"t":"Glowing [[39]] might one day replace street lighting"},{"t":"Current problem: the light is too [[40]]"}],"qs":[{"n":31,"type":"gap","ans":["chemical"],"lim":{"w":1,"num":false},"pat":"p15","ev":["It's the result of a chemical reaction"],"trap":["It isn't reflected light, and it isn't heat."],"why":"Two wrong ideas are ruled out first (reflected light, heat). The gap is followed by 'reaction', so you need an adjective."},{"n":32,"type":"gap","ans":["ocean","oceans","sea"],"lim":{"w":1,"num":false},"pat":"p20","ev":["the vast majority of bioluminescent species are found in the ocean"],"trap":["they're certainly the best-known example on land"],"why":"'You might think… but in fact' is the classic distractor shape. Land is the expectation; the ocean is the answer."},{"n":33,"type":"gap","ans":["water"],"lim":{"w":1,"num":false},"pat":"p16","ev":["blue light travels furthest through water"],"trap":["Red light disappears very quickly underwater"],"why":"Here the notes and the speaker use nearly the same words. Red light is mentioned first as the contrast."},{"n":34,"type":"gap","ans":["ink"],"lim":{"w":1,"num":false},"pat":"p15","ev":["release a cloud of glowing ink"],"why":"'A cloud of glowing ink' becomes 'glowing ___'. Write ink only: 'glowing' is printed."},{"n":35,"type":"gap","ans":["lure"],"lim":{"w":1,"num":false},"pat":"p20","ev":["What it actually has is a glowing lure"],"trap":["It's often said to have a glowing tooth"],"why":"'Often said… but that's a misunderstanding' rejects 'tooth'. The answer follows 'what it actually has'."},{"n":36,"type":"gap","ans":["mate","partner"],"lim":{"w":1,"num":false},"pat":"p15","ev":["in order to find a mate"],"why":"'In order to find a mate' matches 'to find a ___' directly."},{"n":37,"type":"gap","ans":["belly","underside"],"lim":{"w":1,"num":false},"pat":"p16","ev":["produce light on their underside, their belly"],"why":"The speaker gives two words for the same thing. Either is accepted, but only one fits the one-word limit at a time."},{"n":38,"type":"gap","ans":["glow"],"lim":{"w":1,"num":false},"pat":"p15","ev":["used to make cancer cells glow"],"why":"'Make cancer cells ___' needs a verb. The speaker's word is glow."},{"n":39,"type":"gap","ans":["trees"],"lim":{"w":1,"num":false},"pat":"p4","ev":["glowing trees might one day replace street lighting"],"why":"Plural: 'trees'. 'Tree' is marked wrong because the speaker and the grammar both need the plural."},{"n":40,"type":"gap","ans":["dim"],"lim":{"w":1,"num":false},"pat":"p20","ev":["the light is simply too dim to be useful"],"trap":["It's not that the technology is too expensive, and safety isn't really a concern."],"why":"Cost and safety are named first and then dismissed. 'The main problem' signals the real answer."}]}]}]},"PATTERNS":[{"id":"p1","part":1,"title":"Spelling names and letters","tag":"Form completion","tech":"Names, streets and postcodes are spelled letter by letter, and the letters that sound alike are the ones tested: <b>A / E / I<\/b>, <b>G / J<\/b>, <b>B / P / V<\/b>, <b>M / N<\/b>, <b>S / F<\/b>. Write the letters in the margin as you hear them, then copy the word. When a speaker confirms a letter (\"G as in golf\"), that confirmation is there because the letter is tested.","speakers":{"R":"Receptionist","C":"Caller"},"lines":[{"s":"R","t":"Can I take your surname, please?"},{"s":"C","t":"Yes, it's Gethin. G, E, T, H, I, N."},{"s":"R","t":"Was that a G or a J at the start?"},{"s":"C","t":"G, as in golf."},{"s":"R","t":"Thank you. And which street do you live on?"},{"s":"C","t":"Brookfield Close. That's B, R, double O, K, F, I, E, L, D."},{"s":"R","t":"B for bravo?"},{"s":"C","t":"That's right."}],"para":["Was that a G or a J at the start?","B for bravo?"],"get":[{"b":"The name is spelled once, then checked.","t":"\"Was that a G or a J?\" tells you exactly which letter the test is about. Questions like this are the signal to listen hardest."},{"b":"\"Double O\" means two letters.","t":"Speakers say repeated letters this way. Write OO, not O."},{"b":"\"Close\" is already printed.","t":"The form says ___ Close, so the street name is all you write."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD for each answer.","items":["Surname: [[1]]","Address: 9 [[2]] Close"],"qs":[{"n":1,"type":"gap","ans":["Gethin"],"lim":{"w":1,"num":true},"ev":["G, E, T, H, I, N","G, as in golf."],"why":"The receptionist checks G or J. Confirmations like this exist because the letter is the test."},{"n":2,"type":"gap","ans":["Brookfield"],"lim":{"w":1,"num":true},"ev":["B, R, double O, K, F, I, E, L, D"],"why":"'Double O' means two Os. 'Close' is printed, so write Brookfield only."}]}],"same":"Write letters in the margin first, then copy them into the gap. Know how speakers say repeated letters: \"double O\", \"double L\"."},{"id":"p2","part":1,"title":"Phone numbers, prices and -teen / -ty","tag":"Form completion","tech":"In British English zero is often said as <b>\"oh\"<\/b>, and repeated digits as <b>\"double\"<\/b>. Numbers ending in -teen and -ty sound alike: the stress usually falls on the end in fif<b>TEEN<\/b> and on the start in <b>FIF<\/b>ty. Write every number in figures.","speakers":{"C":"Caller","R":"Receptionist"},"lines":[{"s":"R","t":"And a phone number where we can reach you?"},{"s":"C","t":"It's oh seven seven three oh, double five two, four one eight."},{"s":"C","t":"And how much is the weekend course?"},{"s":"R","t":"It's fifty pounds. That's five zero, not one five."}],"para":["where we can reach you"],"get":[{"b":"\"Oh\" is zero and \"double five\" is 55.","t":"Convert as you listen: 07730 552418. Never try to hold a phone number in your head."},{"b":"The recording separates fifty from fifteen for you.","t":"\"Five zero, not one five\" is the clue. In the exam you will not always get it, so learn the stress pattern."},{"b":"\"Where we can reach you\" means phone number.","t":"The form says Phone; the speaker never uses that word."}],"groups":[{"layout":"gaps","instr":"Complete the form.","limit":"Write ONE WORD AND/OR A NUMBER for each answer.","items":["Phone: [[1]]","Weekend course: £ [[2]]"],"qs":[{"n":1,"type":"gap","ans":["07730552418","07730 552418","07730 552 418"],"code":true,"ev":["oh seven seven three oh, double five two, four one eight"],"why":"'Oh' is 0 and 'double five' is 55: 07730 552418."},{"n":2,"type":"gap","ans":["50"],"lim":{"w":1,"num":true},"ev":["It's fifty pounds. That's five zero, not one five."],"why":"Fifty, not fifteen. The £ sign is printed, so write 50 only."}]}],"same":"Write numbers as figures straight away. Listen for 'double' and 'oh', and for where the stress falls on -teen and -ty."},{"id":"p3","part":1,"title":"The speaker corrects themselves","tag":"Form completion","tech":"Part 1 conversations deliberately give a wrong detail first and then correct it: <i>\"Tuesday. No, wait, Thursday.\"<\/i> <b>Never write the first thing you hear<\/b> until the speaker has moved on. Correction signals: <i>sorry, no, actually, I mean, wait, it's been changed<\/i>.","speakers":{"C":"Caller","R":"Receptionist"},"lines":[{"s":"C","t":"Could I book an appointment for Tuesday?"},{"s":"R","t":"Tuesday's fully booked, I'm afraid. I could do Thursday."},{"s":"C","t":"Thursday's fine."},{"s":"R","t":"Is ten o'clock OK? Oh, actually, wait. The ten o'clock slot has just gone. Would half past eleven work?"},{"s":"C","t":"Half past eleven is perfect."}],"para":["Oh, actually, wait."],"get":[{"b":"Tuesday is asked for, then refused.","t":"\"Fully booked\" cancels it. The booking moves to Thursday, which the caller accepts."},{"b":"\"Oh, actually, wait\" is a correction signal.","t":"Whatever came just before it, ten o'clock, is about to change."},{"b":"The final time has to fit the word limit.","t":"\"Half past eleven\" is three words. Write it as 11.30."}],"groups":[{"layout":"gaps","instr":"Complete the booking.","limit":"Write ONE WORD AND/OR A NUMBER for each answer.","items":["Day: [[1]]","Time: [[2]]"],"qs":[{"n":1,"type":"gap","ans":["Thursday"],"lim":{"w":1,"num":true},"ev":["I could do Thursday."],"trap":["Could I book an appointment for Tuesday?"],"why":"Tuesday is asked for and refused. The booking is Thursday."},{"n":2,"type":"gap","ans":["11.30","11:30","11.30am","11:30am","11.30 am","11:30 am"],"lim":{"w":1,"num":true},"ev":["Would half past eleven work?"],"trap":["Is ten o'clock OK?"],"why":"Ten o'clock is offered and withdrawn. Write 11.30: 'half past eleven' is three words, over the limit."}]}],"same":"Wait for the speaker to settle before writing. If you hear 'sorry' or 'actually' after you have written something, cross it out and listen again."},{"id":"p4","part":1,"title":"Plurals and word limits","tag":"Form & note completion","tech":"A correct word in the wrong form is marked wrong. Check <b>singular or plural<\/b> against what you heard and against the grammar of the gap. Then check the <b>word limit<\/b>: an article you add (\"the maps\") can push you over it.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"For the hiking trip, everyone needs to bring a few things. Walking boots, of course. And because it can get cold at the top, please bring gloves."},{"s":"G","t":"We'll provide the maps, so you won't need to buy any."}],"para":["because it can get cold at the top"],"get":[{"b":"\"Gloves\" is plural.","t":"You hear the -s, and gloves come in pairs. \"Glove\" is marked wrong."},{"b":"\"We'll provide\" means \"provided by the organisers\".","t":"The notes reword it; the answer word, maps, is the speaker's."},{"b":"The limit is ONE WORD ONLY.","t":"\"The maps\" is two words and scores zero."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","items":["Bring: walking boots and [[1]]","Provided by the organisers: [[2]]"],"qs":[{"n":1,"type":"gap","ans":["gloves"],"lim":{"w":1,"num":false},"ev":["please bring gloves"],"why":"Plural, as you heard it. 'Glove' is marked wrong."},{"n":2,"type":"gap","ans":["maps"],"lim":{"w":1,"num":false},"ev":["We'll provide the maps"],"why":"ONE WORD ONLY, so 'the maps' is two words and scores zero."}]}],"same":"After every gap answer, ask: is it the right form (plural, -ing, -ed)? Is it inside the word limit?"},{"id":"p5","part":2,"title":"Map labelling: following directions","tag":"Map / plan","tech":"Put your pencil on the entrance and <b>move it as the speaker moves<\/b>. Left and right depend on which way you are facing, so turn the map in your head when the speaker turns. Listen for <i>opposite, next to, beyond, at the far end, halfway along<\/i>. Labels come in route order.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"Coming in from the main gate, the café is straight away on your left. The play area is directly opposite the café, on the other side of the path."},{"s":"G","t":"If you follow the path all the way to the far end, the boating lake is in the top right-hand corner, and the toilets are opposite it, on the left."},{"s":"G","t":"The rose garden is about halfway up the path, on your right."}],"para":["Coming in from the main gate","If you follow the path all the way to the far end"],"get":[{"b":"Start at the gate, facing up the map.","t":"Every left and right in this talk follows from that direction."},{"b":"\"Opposite the café\" fixes the play area.","t":"Find the café first; the answer is across the path from it."},{"b":"The toilets are named right next to the lake.","t":"A label mentioned beside the answer is the commonest map distractor."}],"groups":[{"layout":"map","map":"PARK","instr":"Label the map.","limit":"Write the correct letter, A–E.","letters":["A","B","C","D","E"],"qs":[{"n":1,"type":"select","label":"Play area","ans":"A","ev":["The play area is directly opposite the café"],"why":"The café is on your left at the gate, so the play area is on your right at the gate."},{"n":2,"type":"select","label":"Boating lake","ans":"D","ev":["the boating lake is in the top right-hand corner"],"trap":["the toilets are opposite it, on the left"],"why":"Far end, top right. The toilets opposite it (C) are the distractor."},{"n":3,"type":"select","label":"Rose garden","ans":"E","ev":["The rose garden is about halfway up the path, on your right."],"why":"Walking up from the gate, your right is the east side, halfway along."}]}],"same":"Trace the route with your pencil. Every time the speaker says left or right, check which way you are facing."},{"id":"p6","part":2,"title":"Multiple choice: every option is mentioned","tag":"Multiple choice","tech":"In IELTS multiple choice you will usually hear <b>all three options<\/b>. Your job is to hear which two are ruled out. Listen for the words that cancel an option: <i>used to, not any more, won't need, don't really, although, but<\/i>.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"Lots of people ask which is our most popular tour. The castle tour used to be, and the river tour is certainly the cheapest, but these days the one that sells out first is the night walk."},{"s":"G","t":"For the night walk, you won't need a torch, because we provide lamps. And photos don't really come out in the dark. But it gets cold after sunset, so do dress warmly."}],"para":["these days"],"get":[{"b":"All three tours are named.","t":"The castle tour is cancelled by \"used to\"; the river tour is described as cheapest, which is a different question."},{"b":"\"These days\" marks the present.","t":"The answer to \"now the most popular\" follows it."},{"b":"Two items are ruled out before the advice.","t":"No torch needed, photos don't come out: only warm clothes survive."}],"groups":[{"layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":1,"type":"mcq","stem":"Which tour is now the most popular?","opts":{"A":"the castle tour","B":"the river tour","C":"the night walk"},"ans":"C","ev":["the one that sells out first is the night walk"],"trap":["The castle tour used to be","the river tour is certainly the cheapest"],"why":"The castle tour was popular in the past; the river tour is the cheapest, not the most popular."},{"n":2,"type":"mcq","stem":"What does the speaker advise people to bring on the night walk?","opts":{"A":"a torch","B":"a camera","C":"warm clothes"},"ans":"C","ev":["so do dress warmly"],"trap":["you won't need a torch","photos don't really come out in the dark"],"why":"Torch and camera are both mentioned and both ruled out."}]}],"same":"Cross out each option as it is ruled out. The one left standing is your answer, and it is often the last one mentioned."},{"id":"p7","part":2,"title":"Matching: options in a box","tag":"Matching","tech":"The questions follow the order of the recording; the options in the box do not. <b>Read the box before you listen<\/b> so you recognise each option when you hear it reworded. Options can be paraphrased heavily: <i>doesn't charge anything<\/i> = free entry.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"The Science Museum doesn't charge anything to get in, which is great for families."},{"s":"G","t":"The Old Mill can only be visited on a guided tour, and those run every hour."},{"s":"G","t":"The Botanic Gardens used to be free, but there's now a small charge. They do have a lovely café, though."}],"para":["but there's now a small charge"],"get":[{"b":"\"Doesn't charge anything\" means free entry.","t":"The box never uses the speaker's words. You match meanings."},{"b":"\"Great for families\" sounds like option E.","t":"But nothing says young children. Do not stretch a phrase to fit an option."},{"b":"\"Used to be free\" is the past.","t":"\"But there's now a small charge\" cancels it. The café is the current feature."}],"groups":[{"layout":"match","instr":"What does the speaker say about each place?","limit":"Write the correct letter, A–E.","optTitle":"Features","opts":{"A":"free entry","B":"guided tours only","C":"closed on Mondays","D":"has a café","E":"suitable for young children"},"qs":[{"n":1,"type":"select","label":"Science Museum","ans":"A","ev":["doesn't charge anything to get in"],"trap":["which is great for families"],"why":"'Doesn't charge anything' is free entry. 'Great for families' sounds like E, but nothing says young children."},{"n":2,"type":"select","label":"Old Mill","ans":"B","ev":["can only be visited on a guided tour"],"why":"'Only on a guided tour' matches B directly."},{"n":3,"type":"select","label":"Botanic Gardens","ans":"D","ev":["They do have a lovely café, though."],"trap":["used to be free"],"why":"It used to be free, so A is a trap. The café is the current feature."}]}],"same":"Before the audio, read the options and think of one other way each could be said. You are listening for meanings, not words."},{"id":"p8","part":2,"title":"Signpost words point at the answer","tag":"Multiple choice","tech":"Speakers announce what matters: <i>the most important thing, above all, the real reason, what I'd really stress, the main point<\/i>. When you hear a signpost, <b>the answer is in the next few words<\/b>.","speakers":{"G":"Ranger"},"lines":[{"s":"G","t":"There are three things I'd like you to remember. First, keep to the marked paths. Second, keep dogs on a lead near the sheep. But the most important thing of all, and I can't stress this enough, is to close every gate behind you."}],"para":["There are three things I'd like you to remember."],"get":[{"b":"The speaker announces a list of three.","t":"So you know three rules are coming, and that the question will pick one."},{"b":"\"But the most important thing of all\" breaks the list.","t":"That signpost points straight at the answer."},{"b":"\"I can't stress this enough\" repeats the signal.","t":"Speakers stack emphasis on the point the question asks about."}],"groups":[{"layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":1,"type":"mcq","stem":"Which rule does the ranger say is most important?","opts":{"A":"keeping to the paths","B":"keeping dogs on a lead","C":"closing gates"},"ans":"C","ev":["the most important thing of all, and I can't stress this enough, is to close every gate behind you"],"why":"All three are rules, but only one is signposted as 'the most important thing of all'."}]}],"same":"Learn the signposts in the Toolkit. When you hear one, stop writing and listen hard to the next sentence."},{"id":"p9","part":2,"title":"Short-answer questions","tag":"Short answer","tech":"Short-answer questions begin with <b>What, Who, Where, How many<\/b>. The question word tells you the type of answer. They follow the order of the recording. Write the <b>shortest phrase<\/b> from the recording that answers it, inside the word limit.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"The museum's newest gallery is devoted to the history of flight. It opened last spring and was paid for almost entirely by a local airline."},{"s":"G","t":"The most popular exhibit is a full-size model of the first powered aeroplane, which hangs from the ceiling of the main hall."},{"s":"G","t":"Children especially love the flight simulator on the top floor, though there's usually a queue, so we suggest booking a time slot at the information desk."}],"para":["is devoted to","we suggest booking"],"get":[{"b":"\"Devoted to\" means \"the subject of\".","t":"The question's word, subject, is never said. The answer word is flight."},{"b":"Two places are named close together.","t":"The main hall holds the model plane; the top floor holds the simulator. Match the thing the question asks about, not the first place you hear."},{"b":"\"We suggest booking\" answers \"Where should visitors book?\"","t":"The place follows: the information desk."}],"groups":[{"layout":"short","instr":"Answer the questions.","limit":"Write NO MORE THAN TWO WORDS for each answer.","qs":[{"n":1,"type":"gap","stem":"What is the subject of the new gallery?","ans":["flight"],"lim":{"w":2,"num":true},"ev":["devoted to the history of flight"],"why":"'The history of flight' is four words. The subject in one word is flight."},{"n":2,"type":"gap","stem":"Who paid for most of the gallery?","ans":["local airline","airline","an airline"],"lim":{"w":2,"num":true},"ev":["paid for almost entirely by a local airline"],"why":"Two words fit: local airline. 'A local airline' is three."},{"n":3,"type":"gap","stem":"Where is the flight simulator?","ans":["top floor"],"lim":{"w":2,"num":true},"ev":["the flight simulator on the top floor"],"trap":["which hangs from the ceiling of the main hall"],"why":"The main hall is where the model plane hangs. The simulator is on the top floor."},{"n":4,"type":"gap","stem":"Where can visitors book a time slot?","ans":["information desk"],"lim":{"w":2,"num":true},"ev":["booking a time slot at the information desk"],"why":"'Information desk' is exactly two words."}]}],"same":"Answer the question word: Where needs a place, Who a person or organisation, How many a number. Take the shortest phrase from the recording."},{"id":"p10","part":3,"title":"Who thinks what","tag":"Multiple choice","tech":"Part 3 questions often ask about <b>one named speaker<\/b>. The other speaker frequently gives the wrong answer first. Note the name in the question and listen for that person's voice.","speakers":{"A":"Tom","B":"Nadia"},"lines":[{"s":"A","t":"I think the interviews were the most useful part of our research."},{"s":"B","t":"Really? I found them a bit disappointing, actually. People just told us what we wanted to hear. For me, the observation was much more revealing."},{"s":"A","t":"Maybe you're right."}],"para":["Really?"],"get":[{"b":"Tom speaks first, and gives the interviews.","t":"But both questions ask about Nadia."},{"b":"\"Really?\" signals disagreement.","t":"Nadia is about to give a different view."},{"b":"\"For me\" introduces Nadia's own choice.","t":"The observation. \"Revealing\" describes the observation, not the interviews."}],"groups":[{"layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":1,"type":"mcq","stem":"Which research method does Nadia think was most useful?","opts":{"A":"interviews","B":"observation","C":"questionnaires"},"ans":"B","ev":["For me, the observation was much more revealing."],"trap":["I think the interviews were the most useful part of our research."],"why":"Interviews are Tom's view. The question asks about Nadia."},{"n":2,"type":"mcq","stem":"What is Nadia's opinion of the interviews?","opts":{"A":"They were revealing.","B":"They were disappointing.","C":"They were too short."},"ans":"B","ev":["I found them a bit disappointing"],"why":"'Revealing' is used about the observation, not the interviews."}]}],"same":"Underline the name in every Part 3 question. When you hear the other voice, you are probably hearing a distractor."},{"id":"p11","part":3,"title":"Choose TWO: agreement and rejection","tag":"Multiple choice (two answers)","tech":"With several options and two answers, the speakers usually discuss <b>most of them<\/b>. Listen for agreement (<i>agreed, definitely, has to go in<\/i>) and rejection (<i>hardly anyone, that's sorted, not really<\/i>). Each correct letter scores one mark, in any order.","speakers":{"A":"Tom","B":"Nadia"},"lines":[{"s":"A","t":"So which two problems should we focus on in the presentation? Noise, cost, lack of space, or the opening hours?"},{"s":"B","t":"Noise is the obvious one. Everyone mentioned it."},{"s":"A","t":"Agreed. What about cost?"},{"s":"B","t":"Hardly anyone complained about cost, actually."},{"s":"A","t":"True. And space?"},{"s":"B","t":"Yes, space has to go in. The library's full by ten every morning."},{"s":"A","t":"And opening hours? People did mention them, but they've just been extended, so that's sorted."}],"para":["Agreed."],"get":[{"b":"Four options, two survive.","t":"Every option is discussed, so hearing one is not enough. You need its verdict."},{"b":"\"Agreed\" and \"has to go in\" put an option in.","t":"Noise and space."},{"b":"\"Hardly anyone complained\" and \"that's sorted\" take one out.","t":"Cost and opening hours."}],"groups":[{"layout":"multi","instr":"Choose TWO letters, A–D.","limit":"","qs":[{"n":[1,2],"type":"multi","stem":"Which TWO problems will they focus on?","opts":{"A":"noise","B":"cost","C":"lack of space","D":"opening hours"},"ans":["A","C"],"ev":["Noise is the obvious one.","space has to go in"],"trap":["Hardly anyone complained about cost","so that's sorted"],"why":"Noise and space are agreed. Cost is rejected and opening hours are already solved."}]}],"same":"Make a tick or cross beside each option as it is discussed. Never choose more letters than the question asks for."},{"id":"p12","part":3,"title":"The speaker changes their mind","tag":"Multiple choice","tech":"In discussions, the first idea is often not the final one. The decision usually follows <i>actually, instead, on second thoughts, all right then, let's<\/i>. Wait for the end of the exchange before choosing.","speakers":{"A":"Tom","B":"Nadia"},"lines":[{"s":"A","t":"I was going to do my presentation on solar power."},{"s":"B","t":"That's what most people are doing, though."},{"s":"A","t":"Hmm, that's true. Wind power, then? No, actually, I've just remembered the tutor said we should pick something local. I'll do the tidal project on the river instead."}],"para":["No, actually,"],"get":[{"b":"Solar power is dropped.","t":"\"I was going to\" already tells you it is no longer the plan."},{"b":"Wind power is proposed and dropped in one breath.","t":"\"No, actually\" cancels it."},{"b":"\"Instead\" marks the final decision.","t":"The tidal project on the river."}],"groups":[{"layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":1,"type":"mcq","stem":"What will Tom give his presentation on?","opts":{"A":"solar power","B":"wind power","C":"a local tidal project"},"ans":"C","ev":["I'll do the tidal project on the river instead."],"trap":["I was going to do my presentation on solar power.","Wind power, then?"],"why":"Two topics are tried and dropped. 'Instead' marks the final decision."}]}],"same":"Treat the first idea in a Part 3 exchange as provisional. Only commit when the conversation moves on."},{"id":"p13","part":3,"title":"Flow-chart completion","tag":"Flow-chart","tech":"A flow-chart follows the order of the talk. Each box usually begins where the speaker says <i>first, then, after that, once, finally<\/i>. Read the boxes before listening and predict the type of word each gap needs.","speakers":{"L":"Speaker"},"lines":[{"s":"L","t":"To make paper by hand, old cloth is first cut into small pieces and soaked in water. It's then beaten for several hours until it becomes a pulp."},{"s":"L","t":"A wire screen is dipped into the pulp, and the thin layer that forms on it is pressed between pieces of felt to remove the water. Finally, the sheets are hung up to dry."}],"para":["It's then beaten","Finally,"],"get":[{"b":"Each box starts at a sequence word.","t":"First, then, finally. They tell you which box you are on."},{"b":"\"Soaked in ___\" needs a noun.","t":"Predicting the word type before you listen makes the answer easy to catch."},{"b":"\"Pieces of felt\" is a material.","t":"Do not write the past tense of \"feel\". Context tells you which felt."}],"groups":[{"layout":"flow","instr":"Complete the flow-chart.","limit":"Write ONE WORD ONLY for each answer.","items":["Old cloth is cut into pieces and soaked in [[1]]","It is beaten for several hours until it becomes a [[2]]","A screen is dipped in; the layer is pressed between pieces of [[3]]","The sheets are hung up to dry"],"qs":[{"n":1,"type":"gap","ans":["water"],"lim":{"w":1,"num":false},"ev":["soaked in water"],"why":"'Soaked in ___' needs a noun."},{"n":2,"type":"gap","ans":["pulp"],"lim":{"w":1,"num":false},"ev":["until it becomes a pulp"],"why":"'Becomes a ___' needs a singular noun."},{"n":3,"type":"gap","ans":["felt"],"lim":{"w":1,"num":false},"ev":["pressed between pieces of felt"],"why":"'Pieces of ___' is followed by felt, a material."}]}],"same":"One box, one sequence word. If you hear 'finally' and the earlier boxes are empty, move on and guess them later."},{"id":"p14","part":3,"title":"Who agrees: one speaker or both?","tag":"Matching opinions","tech":"A common Part 3 task asks who holds a view: <b>A<\/b> the first speaker only, <b>B<\/b> the second only, <b>C<\/b> both. After every opinion, listen to the reply. <i>Exactly, me too, so do I, I agree<\/i> make it <b>both<\/b>. <i>Really? Actually, I'd say<\/i> keep it with <b>one<\/b>.","speakers":{"A":"Tom","B":"Nadia"},"lines":[{"s":"A","t":"I think the online lectures were really convenient."},{"s":"B","t":"Exactly. I watched most of them on the bus."},{"s":"A","t":"But I found the group project quite stressful."},{"s":"B","t":"Really? I enjoyed it, actually. It was the exams that stressed me out."},{"s":"A","t":"Oh, the exams were fine for me."}],"para":["Exactly."],"get":[{"b":"\"Exactly\" turns Tom's view into a shared one.","t":"One word of agreement is enough to make the answer both."},{"b":"\"Really? I enjoyed it\" is disagreement.","t":"The stressful group project stays with Tom only."},{"b":"Nadia names her own stress: the exams.","t":"Tom then says the exams were fine, so it is Nadia only, not both."}],"groups":[{"layout":"match","instr":"Who expresses each opinion?","limit":"Write the correct letter, A, B or C.","optTitle":"Speakers","opts":{"A":"Tom only","B":"Nadia only","C":"both Tom and Nadia"},"qs":[{"n":1,"type":"select","label":"The online lectures were convenient.","ans":"C","ev":["I think the online lectures were really convenient."],"why":"Tom says it and Nadia agrees: 'Exactly'."},{"n":2,"type":"select","label":"The group project was stressful.","ans":"A","ev":["I found the group project quite stressful"],"trap":["Really? I enjoyed it, actually."],"why":"Nadia disagrees, so only Tom."},{"n":3,"type":"select","label":"The exams were stressful.","ans":"B","ev":["It was the exams that stressed me out."],"trap":["the exams were fine for me"],"why":"Nadia only. Tom found them fine."}]}],"same":"Every time a view is stated, wait for the other speaker's reply before choosing. The reply decides between one and both."},{"id":"p15","part":4,"title":"Lecture notes: predict before you listen","tag":"Note completion","tech":"Part 4 is one speaker, no break, and usually ten gaps. Use the reading time to <b>predict the type of word<\/b> for every gap: noun or adjective, singular or plural, number or word. The notes follow the lecture in order.","speakers":{"L":"Lecturer"},"lines":[{"s":"L","t":"The honeybee's waggle dance tells other bees where food is. The angle of the dance shows the direction of the food in relation to the sun, and the length of the waggle shows the distance. A longer waggle means the food is further away."}],"para":["in relation to the sun"],"get":[{"b":"\"In relation to the sun\" means \"relative to the sun\".","t":"The notes reword it. When you hear it, gap 1 has just gone by."},{"b":"The two gaps are a pair.","t":"Angle shows direction; length shows distance."},{"b":"The last sentence confirms gap 2.","t":"\"A longer waggle means further away\" is about distance."}],"groups":[{"layout":"notes","title":"The waggle dance","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","notes":[{"t":"The angle of the dance shows the [[1]] of the food relative to the sun"},{"t":"The length of the waggle shows the [[2]]"}],"qs":[{"n":1,"type":"gap","ans":["direction"],"lim":{"w":1,"num":false},"ev":["shows the direction of the food"],"why":"'Relative to the sun' predicts something about position: direction."},{"n":2,"type":"gap","ans":["distance"],"lim":{"w":1,"num":false},"ev":["the length of the waggle shows the distance"],"why":"'The ___' after 'shows' needs a noun. Distance completes the pair with direction."}]}],"same":"Before the audio, write a tiny label beside each gap: n (noun), adj, pl, num. It turns listening into checking."},{"id":"p16","part":4,"title":"Paraphrase: the notes don't use the speaker's words","tag":"Note completion","tech":"The notes are reworded; the answer word is not. Listen for the <b>meaning<\/b> of the notes, then write the word the speaker actually uses. Watch for <i>the main reason wasn't X… it was Y<\/i>: X is the trap.","speakers":{"L":"Lecturer"},"lines":[{"s":"L","t":"Early cities grew up near rivers, and the main reason wasn't transport, as many people assume. It was that rivers provided a reliable supply of water for crops."}],"para":["as many people assume","It was that"],"get":[{"b":"\"As many people assume\" means \"common assumption\".","t":"That links gap 1 to the word just before it: transport."},{"b":"\"It was that\" means \"actual main reason\".","t":"Gap 2 follows it."},{"b":"\"Wasn't X… it was Y\" is the classic shape.","t":"X is the rejected idea; Y is the answer to the main-reason question."}],"groups":[{"layout":"notes","title":"Early cities","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","notes":[{"t":"Common assumption: rivers were important for [[1]]"},{"t":"Actual main reason: a reliable water supply for [[2]]"}],"qs":[{"n":1,"type":"gap","ans":["transport"],"lim":{"w":1,"num":false},"ev":["the main reason wasn't transport"],"why":"'Common assumption' paraphrases 'as many people assume'."},{"n":2,"type":"gap","ans":["crops"],"lim":{"w":1,"num":false},"ev":["a reliable supply of water for crops"],"why":"'Actual main reason' paraphrases 'It was that'. Transport is the rejected idea."}]}],"same":"Predict what the speaker might say for each line of the notes. You are matching ideas, then copying the speaker's word."},{"id":"p17","part":4,"title":"Following lecture structure","tag":"Note completion","tech":"Lectures are organised: <i>firstly, a second factor, another reason, finally, perhaps most importantly<\/i>. Each signpost usually opens a new gap. If you know which point the lecturer is on, you never lose your place.","speakers":{"L":"Lecturer"},"lines":[{"s":"L","t":"There are three reasons why the coastline is eroding. The first is rising sea levels. A second factor is the removal of sand for construction. And thirdly, and perhaps most surprisingly, the loss of seagrass, which used to hold the sand in place."}],"para":["There are three reasons","A second factor","And thirdly"],"get":[{"b":"\"There are three reasons\" tells you the shape.","t":"Number the points in the notes 1, 2, 3 before the audio starts."},{"b":"\"A second factor\" opens gap 1.","t":"The answer arrives a few words later: sand."},{"b":"\"Thirdly\" opens gap 2.","t":"\"Perhaps most surprisingly\" adds emphasis but is not the answer."}],"groups":[{"layout":"notes","title":"Causes of coastal erosion","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","notes":[{"t":"1. Rising sea levels"},{"t":"2. Removal of [[1]] for construction"},{"t":"3. Loss of [[2]]"}],"qs":[{"n":1,"type":"gap","ans":["sand"],"lim":{"w":1,"num":false},"ev":["the removal of sand for construction"],"why":"'A second factor' marks the start of point 2."},{"n":2,"type":"gap","ans":["seagrass","sea-grass"],"lim":{"w":1,"num":false},"ev":["the loss of seagrass"],"why":"'Thirdly' opens point 3. One word: seagrass."}]}],"same":"Number the points in the notes before you listen, and tick each one off when you hear its signpost."},{"id":"p18","part":4,"title":"Recovering when you lose your place","tag":"Note completion","tech":"Two gaps close together are where most marks are lost. If you miss one, <b>do not stop<\/b>. Move your eyes to the next gap's key words and wait for them. When you hear them, you are back in place; guess the missed gap at the end.","speakers":{"L":"Lecturer"},"lines":[{"s":"L","t":"Coral reefs cover less than one percent of the ocean floor, yet they support around a quarter of all marine species. That's why they're often called the rainforests of the sea."}],"para":["That's why they're often called"],"get":[{"b":"Two answers come in consecutive sentences.","t":"There is no gap between them to catch up."},{"b":"\"Often called\" means \"known as\".","t":"It announces gap 2."},{"b":"\"Of the sea\" is printed in the notes.","t":"Keep it in view: when you hear it, the answer has just been said."}],"groups":[{"layout":"notes","title":"Coral reefs","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","notes":[{"t":"Cover less than 1% of the ocean floor"},{"t":"Support about a [[1]] of marine species"},{"t":"Known as the [[2]] of the sea"}],"qs":[{"n":1,"type":"gap","ans":["quarter"],"lim":{"w":1,"num":false},"ev":["around a quarter of all marine species"],"why":"'About a ___ of' needs a fraction word: quarter."},{"n":2,"type":"gap","ans":["rainforests","rain-forests"],"lim":{"w":1,"num":false},"ev":["the rainforests of the sea"],"why":"Comes immediately after gap 1. Keep 'of the sea' in view so you catch it even if gap 1 slips."}]}],"same":"Always read one gap ahead. The words around the next gap are your alarm clock."},{"id":"p19","part":4,"title":"Table completion in a lecture","tag":"Table completion","tech":"Tables run <b>row by row<\/b>. Before the audio, read across each row: the column headings tell you what kind of word each gap needs, and the filled cells tell you where the speaker is. The lecturer usually finishes one row before starting the next.","speakers":{"L":"Lecturer"},"lines":[{"s":"L","t":"Let's compare three early writing materials. Clay tablets were used in Mesopotamia. They were cheap and very durable, but heavy to carry."},{"s":"L","t":"Papyrus came from Egypt. It was light and easy to roll, but it became brittle in damp conditions."},{"s":"L","t":"Parchment, made from animal skin, was strong and could be reused by scraping off the ink, but it was expensive to produce."}],"para":["in damp conditions","but heavy to carry"],"get":[{"b":"The lecture goes row by row.","t":"Clay, then papyrus, then parchment. Each sentence group fills one row."},{"b":"The headings predict the word.","t":"In the Advantage column, \"cheap and ___\" needs an adjective."},{"b":"\"In damp conditions\" means \"when damp\".","t":"The cell is reworded; the answer word, brittle, is the speaker's."},{"b":"Parchment's disadvantage is already filled in.","t":"\"Expensive\" belongs in the Disadvantage column. Do not put it in the Advantage gap."}],"groups":[{"layout":"table","instr":"Complete the table.","limit":"Write ONE WORD ONLY for each answer.","cols":["Material","Region","Advantage","Disadvantage"],"rows":[["Clay tablets","Mesopotamia","cheap and [[1]]","heavy"],["Papyrus","[[2]]","light","became [[3]] when damp"],["Parchment","—","strong; could be [[4]]","expensive"]],"qs":[{"n":1,"type":"gap","ans":["durable"],"lim":{"w":1,"num":false},"ev":["They were cheap and very durable"],"why":"'Cheap and ___' in the Advantage column needs an adjective: durable."},{"n":2,"type":"gap","ans":["Egypt"],"lim":{"w":1,"num":false},"ev":["Papyrus came from Egypt."],"why":"The Region column needs a place."},{"n":3,"type":"gap","ans":["brittle"],"lim":{"w":1,"num":false},"ev":["it became brittle"],"why":"'Became ___ when damp' matches 'became brittle in damp conditions'."},{"n":4,"type":"gap","ans":["reused"],"lim":{"w":1,"num":false},"ev":["could be reused by scraping off the ink"],"trap":["it was expensive to produce"],"why":"'Could be ___' needs a past participle: reused. 'Expensive' is the disadvantage, already printed."}]}],"same":"Read across every row before you listen. Filled cells tell you both the form of the answer and where the speaker is."},{"id":"p20","part":0,"title":"Distractors: what people think vs what is true","tag":"All parts","tech":"The commonest distractor shapes: <i>Many people believe X. In fact, Y.<\/i> · <i>It used to be X; now it's Y.<\/i> · <i>I expected X, but…<\/i> · <i>I did consider X, but…<\/i>. In every case X is mentioned first and is wrong.","speakers":{"L":"Speaker"},"lines":[{"s":"L","t":"A lot of people believe that we lose most of our body heat through our heads. In fact, the head loses heat at roughly the same rate as any other uncovered part of the body."}],"para":["In fact,"],"get":[{"b":"\"A lot of people believe\" introduces the wrong idea.","t":"Expect it to be overturned."},{"b":"\"In fact\" introduces the right one.","t":"The answer follows immediately."},{"b":"Option A repeats the popular belief.","t":"The option that matches the first thing you hear is often the trap."}],"groups":[{"layout":"mcq","instr":"Choose the correct letter, A, B or C.","limit":"","qs":[{"n":1,"type":"mcq","stem":"According to the speaker, the head loses heat","opts":{"A":"faster than other parts of the body.","B":"at about the same rate as other uncovered parts.","C":"more slowly than other parts of the body."},"ans":"B","ev":["the head loses heat at roughly the same rate as any other uncovered part of the body"],"trap":["A lot of people believe that we lose most of our body heat through our heads."],"why":"'A lot of people believe' introduces the wrong answer. 'In fact' introduces the right one."}]}],"same":"When you hear 'many people think', 'it used to', 'I expected' or 'I did consider', get ready: the real answer is coming next."},{"id":"p21","part":0,"title":"Synonyms: the question's word is not the speaker's word","tag":"All parts","tech":"Questions are written with different words from the recording. <i>Price<\/i> may be heard as <i>affordable<\/i>; <i>closes<\/i> as <i>open until<\/i>. Listen for the idea, and for gap-fill answers write the word you hear.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"The new sports hall won't cost the earth. It's actually one of the more affordable facilities in the area. And it's open until late every evening."}],"para":["won't cost the earth"],"get":[{"b":"\"Won't cost the earth\" is an idiom for cheap.","t":"It tells you the price idea is coming."},{"b":"\"Affordable\" is the speaker's own word.","t":"That is what you write, even though the notes say Price."},{"b":"\"Open until late\" answers \"closing time\".","t":"The notes and the speaker describe the same thing from opposite ends."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","items":["Price of the sports hall: [[1]]","Closing time in the evening: [[2]]"],"qs":[{"n":1,"type":"gap","ans":["affordable"],"lim":{"w":1,"num":false},"ev":["one of the more affordable facilities in the area"],"why":"'Price' never appears. 'Affordable' carries the idea; write the speaker's word."},{"n":2,"type":"gap","ans":["late"],"lim":{"w":1,"num":false},"ev":["it's open until late every evening"],"why":"'Closing time' is heard as 'open until'."}]}],"same":"For every question, think of two other ways the idea could be said before the audio starts."},{"id":"p22","part":0,"title":"Spelling: the words the test keeps using","tag":"All parts","tech":"An answer is only correct if it is <b>spelled correctly<\/b>. A small set of everyday words appears again and again. Learn them until you never have to think: the full list is in the Toolkit.","speakers":{"R":"Receptionist"},"lines":[{"s":"R","t":"We can certainly help you find accommodation near the college."},{"s":"R","t":"The welcome meeting is on Wednesday afternoon."},{"s":"R","t":"And please remember to bring your receipt with you."}],"para":["help you find","please remember to bring"],"get":[{"b":"Accommodation has double c and double m.","t":"The single most misspelled word in IELTS Listening."},{"b":"Wednesday has a silent d.","t":"Capital letters do not matter; the letters do."},{"b":"Receipt has a silent p.","t":"And e before i after c."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD ONLY for each answer.","items":["Help available with: [[1]]","Welcome meeting: [[2]] afternoon","Bring your [[3]]"],"qs":[{"n":1,"type":"gap","ans":["accommodation"],"lim":{"w":1,"num":false},"ev":["find accommodation"],"why":"Double c, double m: accommodation."},{"n":2,"type":"gap","ans":["Wednesday"],"lim":{"w":1,"num":false},"ev":["on Wednesday afternoon"],"why":"Silent d: Wednesday."},{"n":3,"type":"gap","ans":["receipt"],"lim":{"w":1,"num":false},"ev":["bring your receipt"],"why":"Silent p: receipt."}]}],"same":"Keep a personal list of every word you misspell in practice. Those are the marks you can win back for certain."},{"id":"p23","part":0,"title":"Answer format: units, symbols and dates","tag":"All parts","tech":"If a unit or symbol is printed beside the gap (£, km, %), <b>write the number only<\/b>. Write numbers in figures. Any clear date format is accepted: 5 May, May 5, 5th May.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"The walk is twelve kilometres in total."},{"s":"G","t":"Tickets cost eight pounds fifty each."},{"s":"G","t":"And the trip takes place on the fifth of May."}],"para":["in total","takes place"],"get":[{"b":"\"Kilometres\" is printed as km.","t":"So the answer is 12, not 12 km."},{"b":"\"Eight pounds fifty\" is 8.50.","t":"The £ sign is printed. Write the figure only."},{"b":"Any clear date format is accepted.","t":"5 May is shortest and safest."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD AND/OR A NUMBER for each answer.","items":["Distance: [[1]] km","Ticket price: £ [[2]]","Date: [[3]]"],"qs":[{"n":1,"type":"gap","ans":["12"],"lim":{"w":1,"num":true},"ev":["twelve kilometres"],"why":"'km' is printed, so write 12."},{"n":2,"type":"gap","ans":["8.50"],"lim":{"w":1,"num":true},"ev":["eight pounds fifty"],"why":"Eight pounds fifty is 8.50. The £ sign is printed."},{"n":3,"type":"gap","ans":["5 May","5th May","May 5","May 5th","5/5"],"lim":{"w":1,"num":true},"ev":["on the fifth of May"],"why":"Any clear format is accepted. Keep it short."}]}],"same":"Read the printed words around every gap before you write, and never copy them into your answer."},{"id":"p24","part":0,"title":"When the answer comes before the keyword","tag":"All parts","tech":"You wait for the words in the question, but sometimes the speaker gives the <b>answer first and the keyword after<\/b>: <i>\"Forty minutes. That's how long the trip takes.\"<\/i> If you only start listening at the keyword, the answer has already gone. Keep listening a sentence before and after.","speakers":{"G":"Guide"},"lines":[{"s":"G","t":"Forty minutes. That's how long the boat trip to the island takes."},{"s":"G","t":"And bring cash, because the café on the island doesn't accept cards."}],"para":["That's how long the boat trip to the island takes."],"get":[{"b":"\"Forty minutes\" comes before the topic is named.","t":"If you wait for \"journey time\", you miss it."},{"b":"\"How long the boat trip takes\" means journey time.","t":"It confirms the answer you have just heard."},{"b":"\"Bring cash\" comes before \"café\".","t":"And \"cards\" is the option ruled out, not the answer."}],"groups":[{"layout":"gaps","instr":"Complete the notes.","limit":"Write ONE WORD AND/OR A NUMBER for each answer.","items":["Journey time to the island: [[1]] minutes","Payment at the island café: [[2]] only"],"qs":[{"n":1,"type":"gap","ans":["40"],"lim":{"w":1,"num":true},"ev":["Forty minutes."],"why":"The number is said first; the topic, the boat trip, follows."},{"n":2,"type":"gap","ans":["cash"],"lim":{"w":1,"num":true},"ev":["And bring cash"],"trap":["doesn't accept cards"],"why":"Cash is said before the café is mentioned. Cards are what the café refuses."}]}],"same":"Do not switch on only at the keyword. Hold what you hear in the sentence before it; the keyword often confirms an answer already given."}],"TECH":{"predict":{"options":["number","date or time","name","singular noun","plural noun","adjective","verb"],"items":[{"t":"The course starts on ______.","ans":"date or time","why":"'Starts on' is followed by a day or date."},{"t":"Please bring two ______ with you.","ans":"plural noun","why":"'Two' needs a plural noun."},{"t":"The guide's name is Mr ______.","ans":"name","why":"'Mr' is followed by a surname: expect it to be spelled."},{"t":"Price per person: £ ______","ans":"number","why":"The £ sign is printed, so you write the figure only."},{"t":"The museum is especially ______ with families.","ans":"adjective","why":"'Is especially ___ with' needs an adjective such as popular."},{"t":"Volunteers must ______ the gate behind them.","ans":"verb","why":"'Must' is followed by a base verb."},{"t":"The meeting will be held in the ______.","ans":"singular noun","why":"'The ___' with no number suggests one place: a singular noun."}]},"signposts":{"options":["changing topic","the key point","an example","a contrast","a correction","concluding"],"items":[{"t":"Moving on to the next stage…","ans":"changing topic"},{"t":"The main reason, though, is…","ans":"the key point"},{"t":"Take, for instance, …","ans":"an example"},{"t":"However, the results showed…","ans":"a contrast"},{"t":"Sorry, I mean…","ans":"a correction"},{"t":"So, to sum up…","ans":"concluding"}]},"dictation":[{"label":"Surname","say":"J, E, R, V, I, S.","ans":["Jervis"],"why":"J, not G. Listen for the confirming word if one is given."},{"label":"Surname","say":"Q, U, I, N, C, E, Y.","ans":["Quincey"],"why":"Q is always followed by U in English names."},{"label":"Number","say":"Forty.","ans":["40"],"why":"FOR-ty: the stress is on the first part. Fourteen would be four-TEEN."},{"label":"Phone","say":"Oh one six one, double four, nine six seven.","ans":["016144967","0161 44967","0161 44 967"],"code":true,"why":"'Oh' is 0 and 'double four' is 44: 0161 44967."},{"label":"Price","say":"Thirteen pounds ninety-nine.","ans":["13.99","£13.99"],"why":"Pounds and pence: 13.99."},{"label":"Date","say":"The twenty-first of August.","ans":["21 August","21st August","August 21","August 21st","21/8"],"why":"Write it short: 21 August."}],"distractor":{"speakers":{"G":"Guide"},"lines":[{"s":"G","t":"The bus leaves at quarter past seven. No, sorry, that's been changed. It leaves at half past seven now."}],"q":{"n":1,"type":"gap","ans":["7.30","7:30","7.30am","7:30am","7.30 am","7:30 am"],"lim":{"w":1,"num":true},"ev":["It leaves at half past seven now."],"trap":["The bus leaves at quarter past seven."],"why":"The first time is corrected. Write the time in figures: 7.30."}},"limits":{"rule":"ONE WORD AND/OR A NUMBER","items":[{"a":"15 May","ok":true,"why":"One word and one number: allowed."},{"a":"the library","ok":false,"why":"Two words. Write 'library'."},{"a":"half past ten","ok":false,"why":"Three words. Write 10.30."},{"a":"well-known","ok":true,"why":"A hyphenated word counts as one word."},{"a":"07730 552418","ok":true,"why":"A phone number counts as a number."},{"a":"two tickets","ok":false,"why":"'two' is a word here. Write '2 tickets', or just 'tickets' if 'two' is printed."}]}}};</script>
<script>
(function () {
'use strict';
var DATA = window.LAB;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function idk(k) { return String(k).replace(/[^a-zA-Z0-9]/g, '-'); }

/* ================================================================ storage */
var KEY = 'ielts-listening-lab-v2';
function fresh() { return { settings: { voice: '', rate: 1 }, test: { ans: {}, played: {}, replayed: {}, submitted: false }, pat: {}, tech: {} }; }
var S = (function () {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw), f = fresh();
      return { settings: Object.assign(f.settings, o.settings || {}), test: Object.assign(f.test, o.test || {}), pat: o.pat || {}, tech: o.tech || {} };
    }
  } catch (e) {}
  return fresh();
})();
var saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 150); }

/* ================================================================ speech */
var TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [], token: 0, cur: null,
  load: function () {
    if (!this.ok) return;
    try { this.voices = speechSynthesis.getVoices().filter(function (v) { return /^en([-_]|$)/i.test(v.lang); }); } catch (e) { this.voices = []; }
  },
  ranked: function () {
    function pri(l) { return /GB|UK/i.test(l) ? 0 : /AU/i.test(l) ? 1 : /NZ|IE|ZA/i.test(l) ? 2 : /CA/i.test(l) ? 3 : /US/i.test(l) ? 4 : 5; }
    return this.voices.slice().sort(function (a, b) { return pri(a.lang) - pri(b.lang); });
  },
  cast: function (speakers) {
    var r = this.ranked(), pref = null;
    for (var i = 0; i < r.length; i++) if (r[i].voiceURI === S.settings.voice) pref = r[i];
    var list = pref ? [pref].concat(r.filter(function (v) { return v !== pref; })) : r;
    var pitches = [1, 0.84, 1.16, 0.94], out = {};
    speakers.forEach(function (s, j) { out[s] = { voice: list.length ? list[j % list.length] : null, pitch: list.length > j ? 1 : pitches[j % pitches.length] }; });
    return out;
  },
  split: function (t) {
    var m = t.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [t];
    return m.map(function (x) { return x.trim(); }).filter(Boolean);
  },
  play: function (lines, opt) {
    opt = opt || {};
    if (!this.ok) { if (opt.onEnd) opt.onEnd(false); return false; }
    this.stop();
    var my = ++this.token, self = this, order = [];
    lines.forEach(function (l) { if (l.s && order.indexOf(l.s) < 0) order.push(l.s); });
    if (order.indexOf('N') > 0) order = ['N'].concat(order.filter(function (x) { return x !== 'N'; }));
    var cast = this.cast(order), chunks = [];
    lines.forEach(function (l, i) {
      if (l.p) chunks.push({ pause: l.p, i: i });
      else self.split(l.t).forEach(function (t) { chunks.push({ t: t, s: l.s, i: i }); });
    });
    var k = 0;
    function step() {
      if (my !== self.token) return;
      if (k >= chunks.length) { self.cur = null; if (opt.onEnd) opt.onEnd(true); return; }
      var c = chunks[k++];
      if (opt.onProgress) opt.onProgress(c.i, k / chunks.length);
      if (c.pause) { setTimeout(step, c.pause); return; }
      var u = new SpeechSynthesisUtterance(c.t), v = cast[c.s], done = false;
      if (v && v.voice) { u.voice = v.voice; u.lang = v.voice.lang; } else u.lang = 'en-GB';
      u.pitch = v ? v.pitch : 1;

/* ================================================================ answers + marking */
function store(ns) {
  if (ns === 'T') return S.test.ans;

  if (!S.pat[ns].opened) S.pat[ns].opened = {};

}
function qkey(q) { return Array.isArray(q.n) ? q.n.join('-') : String(q.n); }

function norm(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/[‘’`]/g, "'").replace(/\s+/g, ' ').trim()
    .replace(/^[\s.,;:!?"'()]+|[\s,;:!?"'()]+$/g, '').replace(/\.$/, '');
}
function lev(a, b) {

  return d[m][n];
}
function overLimit(v, lim) {
  if (!lim) return false;
  var toks = v.split(' ').filter(Boolean);
  var words = toks.filter(function (t) { return /[a-z]/.test(t); }).length, nums = toks.length - words;
  return lim.num ? (words > lim.w || nums > 1) : toks.length > lim.w;
}
function mark(q, val) {
  if (q.type === 'gap') {
    var v = norm(val);
    if (!v) return { st: 'blank', got: 0, max: 1 };
    var cmp = q.code ? function (s) { return s.replace(/[\s-]/g, ''); } : function (s) { return s; };
    var alts = q.ans.map(norm), i;
    for (i = 0; i < alts.length; i++) if (cmp(alts[i]) === cmp(v)) return (!q.code && overLimit(v, q.lim)) ? { st: 'extra', got: 0, max: 1 } : { st: 'ok', got: 1, max: 1 };
    if (!q.code) for (i = 0; i < alts.length; i++) if ((' ' + v + ' ').indexOf(' ' + alts[i] + ' ') >= 0) return { st: 'extra', got: 0, max: 1 };
    var vv = cmp(v), best = 99, longest = 0;
    alts.forEach(function (a) { best = Math.min(best, lev(cmp(a), vv)); longest = Math.max(longest, a.length); });
    return best <= (longest >= 7 ? 2 : 1) ? { st: 'close', got: 0, max: 1 } : { st: 'wrong', got: 0, max: 1 };
  }
  if (q.type === 'mcq' || q.type === 'select') {
    if (!val) return { st: 'blank', got: 0, max: 1 };
    return val === q.ans ? { st: 'ok', got: 1, max: 1 } : { st: 'wrong', got: 0, max: 1 };
  }
  if (q.type === 'multi') {
    var arr = Array.isArray(val) ? val : [];
    if (!arr.length) return { st: 'blank', got: 0, max: 2 };
    if (arr.length > 2) return { st: 'toomany', got: 0, max: 2 };
    var got = arr.filter(function (x) { return q.ans.indexOf(x) >= 0; }).length;
    return { st: got === 2 ? 'ok' : got === 1 ? 'part' : 'wrong', got: got, max: 2 };

}
var MSG = {

function transcriptHTML(lines, speakers, qs, para) {

    (q.trap || []).forEach(function (t) { marks.push({ t: t, c: 'trap', n: qlabel(q) }); });
  });
  (para || []).forEach(function (t) { marks.push({ t: t, c: 'para', n: '' }); });
  marks.sort(function (a, b) { return b.t.length - a.t.length; });
  return '<div class="tx">' + lines.filter(function (l) { return !l.p; }).map(function (l) {
    var h = esc(l.t), ranges = [];
    marks.forEach(function (m) {
      var em = esc(m.t), at = h.indexOf(em);
      if (at < 0) return;
      var end = at + em.length;
      for (var i = 0; i < ranges.length; i++) if (at < ranges[i].e && end > ranges[i].s) return;
      ranges.push({ s: at, e: end, c: m.c, n: m.n });
    });
    ranges.sort(function (a, b) { return a.s - b.s; });
    var out = '', pos = 0;
    ranges.forEach(function (r) {

      pos = r.e;

  }).join('') + '</div>';

  var r = TTS.ranked(), sel = $('#voicesel'), note = $('#voicenote');
  if (!TTS.ok) { note.textContent = 'This browser cannot read text aloud. Try Chrome, Edge or Safari.'; sel.disabled = true; return; }
  note.textContent = !r.length ? 'No English voices found yet. They usually appear a moment after the page loads.' :
    r.length + ' English voice' + (r.length > 1 ? 's' : '') + ' on this device. British and Australian voices are listed first. With fewer voices than speakers, the pitch changes to tell speakers apart.';
  sel.innerHTML = '<option value="">Automatic (best match)</option>' + r.map(function (v) {
    return '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === S.settings.voice ? ' selected' : '') + '>' + esc(v.name + ' · ' + v.lang) + '</option>';
  }).join('');
  $('#ratesel').value = String(S.settings.rate || 1);
}
function updateVoiceChip() { var c = $('#st-voice-name'); if (c) c.textContent = !TTS.ok ? 'Not available in this browser' : (currentVoiceName() || 'Loading voices…'); }
function testVoice() { TTS.play([{ s: 'N', t: 'This is how the recordings will sound. The number is oh seven nine four six. The name is spelled T, H, O, R, N, L, E, Y.' }], { rate: S.settings.rate || 1 }); }
function bindVoicePanel() {
  $('#voicebtn').addEventListener('click', function () { var p = $('#voicepanel'), open = p.hidden; p.hidden = !open; this.setAttribute('aria-expanded', String(open)); if (open) renderVoicePanel(); });
  $('#voicesel').addEventListener('change', function () { S.settings.voice = this.value; save(); updateVoiceChip(); });
  $('#ratesel').addEventListener('change', function () {
    S.settings.rate = parseFloat(this.value) || 1; save();
    $$('.player[data-state="idle"] .pmeta').forEach(function (m) { if (!m.closest('.exam')) m.textContent = 'Replay as often as you like. Speed ' + String(S.settings.rate) + '× (change it under Voice & speed at the top).'; });
  });
  $('#voiceclose').addEventListener('click', function () { $('#voicepanel').hidden = true; $('#voicebtn').setAttribute('aria-expanded', 'false'); });
}

/* ================================================================ boot */
renderAll();
var totop = $('#totop');
totop.addEventListener('click', function () { go('start', 'toc'); });
window.addEventListener('scroll', function () { totop.hidden = window.scrollY < 900; }, { passive: true });
var h0 = (location.hash || '').replace('#', '');
if (/^p\d+$/.test(h0)) go(h0);
else if (/^(technique|test|patterns|toolkit)$/.test(h0)) go(h0);
})();

</script>
</body>
