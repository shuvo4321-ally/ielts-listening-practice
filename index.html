<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="IELTS Listening practice: technique, a full 40-question test and 24 patterns, read aloud.">
<title>IELTS Listening Lab</title>
<style>
/* Same look as the Reading Pattern Walkthrough PDF: always light, Georgia text, Segoe UI labels,
   the PDF's exact colours and square boxes, on a grey "viewer" background with a white sheet. */
:root {
  color-scheme: light;
  --bg: #3A3B3D; --page: #FFFFFF; --ink: #111111; --muted: #3D4A56; --faint: #5A6773; --line: #DDE3E8; --row: #F8FAFB;
  --navy: #14365A; --navy-ink: #FFFFFF; --qn: #2C6E9B;
  --tech: #EEF3F8; --tech-edge: #2C6E9B; --tech-lab: #1F5D87;
  --rec: #FCFAF4; --rec-edge: #C9A227; --rec-lab: #96781C; --rec-line: #E8DDC0;
  --get: #F1F7F1; --get-edge: #2E7D32; --get-lab: #256428;
  --same: #F5F2FA; --same-edge: #5B4B9A; --same-lab: #4A3D82;
  --qa: #F4F7FA; --ok: #2E7D32; --bad: #B23A2E; --bad-lab: #96291F; --warn: #9A6A0E;
  --ok-soft: #E6F3E7; --bad-soft: #FDF2F1; --warn-soft: #FBF2DE;
  --hA: #FFF3B0; --hP: #D6EDD6; --hT: #FBD5D0;
  --m-ground: #EDF1E5; --m-path: #CDC4B3; --m-bld: #FFFFFF; --m-water: #C6DCEE; --m-yard: #E2DACB;
  --f-text: Georgia, "Times New Roman", serif;
  --f-ui: "Segoe UI", Arial, sans-serif;
  --f-mono: "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 17px; line-height: 1.55; }
button, select, input { font-family: var(--f-ui); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tech-edge); outline-offset: 2px; }
b, strong { color: var(--navy); font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 14.5px; color: var(--faint); } .faint { color: var(--faint); }

/* ---------- voice settings (on the cover) + floating contents button ---------- */
#voicepanel { margin: -10px 0 24px; font-family: var(--f-ui); }
.vp { background: var(--qa); border: 1px solid var(--line); border-left: 4px solid var(--navy); padding: 12px 14px; display: grid; gap: 9px; font-size: 14px; }
.vrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vrow label { color: var(--muted); min-width: 100px; }
.vrow select { flex: 1 1 260px; min-width: 0; max-width: 100%; }
select, .gapish { font-size: 14px; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 0; padding: 6px 9px; }
.totop { position: fixed; right: 18px; bottom: 18px; z-index: 20; background: var(--navy); color: var(--navy-ink); border: 0; padding: 9px 14px; font-size: 13.5px; font-weight: 600; letter-spacing: .5px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }

/* ---------- page: a white A4-style sheet ---------- */
main { max-width: 960px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 90px; outline: none; }
#view > div + div { margin-top: 28px; }
.sheetpage { background: var(--page); padding: 64px 72px 72px; }
@media (max-width: 760px) { #view > div + div { margin-top: 10px; } main { padding-inline: 8px; padding-block: 8px 60px; } .sheetpage { padding: 26px 16px 32px; } }
h1, h2, h3 { font-family: var(--f-ui); color: var(--navy); text-wrap: balance; }
h1 { font-size: clamp(28px, 5vw, 36px); line-height: 1.15; margin: 0 0 14px; }
h2 { font-size: 22px; line-height: 1.25; margin: 36px 0 12px; }
h3 { font-size: 18px; margin: 26px 0 8px; }
p { margin: 0 0 12px; }
ul, ol { margin: 0 0 12px; padding-left: 24px; }
li { margin-bottom: 7px; }
.partdiv { margin: 0 0 28px; }
.partdiv .kick { font-family: var(--f-ui); font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--rec-lab); text-transform: uppercase; }
.partdiv h1 { font-size: clamp(28px, 5vw, 37px); margin: 4px 0 12px; }
.partdiv p { font-style: italic; color: var(--muted); margin: 0; font-size: 18px; border-left: 3px solid var(--rec-edge); padding-left: 18px; }

/* ---------- cover + contents ---------- */
.cover .bar { height: 5px; width: 70px; background: var(--navy); margin: 6px 0 26px; }
.cover .tag { display: inline-block; background: var(--navy); color: var(--navy-ink); font-family: var(--f-ui); font-size: 12.5px; font-weight: 600; letter-spacing: 1.3px; padding: 4px 11px; margin-bottom: 18px; }
.cover h1 { font-size: clamp(34px, 6vw, 50px); }
.cover .sub { font-size: 21px; font-style: italic; color: var(--muted); margin-bottom: 22px; }
.cover ul { color: var(--muted); font-size: 18px; }
.audiocheck { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--tech); border-left: 4px solid var(--tech-edge); padding: 14px 18px; margin: 24px 0; font-family: var(--f-ui); font-size: 14.5px; }
.audiocheck .ac-t { flex: 1 1 240px; min-width: 0; }
.audiocheck .ac-v { display: block; font-size: 12.5px; color: var(--faint); overflow-wrap: anywhere; }
.toc h2 { border-top: 4px solid var(--navy); padding-top: 10px; margin-top: 34px; }
.toc .grp { font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--rec-lab); text-transform: uppercase; margin: 18px 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.toc button { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 4px 0; color: var(--ink); font-family: var(--f-text); font-size: 17px; align-items: baseline; }
.toc button:hover .t { color: var(--tech-edge); text-decoration: underline; }
.toc .n { font-family: var(--f-ui); font-size: 12.5px; font-weight: 700; letter-spacing: .5px; color: var(--navy); }
.toc .cc { color: var(--faint); font-style: italic; font-size: 15.5px; }
.toc .st { font-family: var(--f-ui); font-size: 12.5px; font-weight: 600; color: var(--ok); }

/* ---------- boxes (same as the PDF) ---------- */
.box { padding: 20px 26px; margin: 20px 0; }
.lab { display: block; font-family: var(--f-ui); font-size: 13px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
.box p:last-child, .box ol:last-child, .box ul:last-child { margin-bottom: 0; }
.tech { background: var(--tech); border-left: 4px solid var(--tech-edge); } .tech .lab { color: var(--tech-lab); }
.rec { background: var(--rec); border: 1px solid var(--rec-line); border-left: 4px solid var(--rec-edge); } .rec .lab { color: var(--rec-lab); }
.get { background: var(--get); border-left: 4px solid var(--get-edge); } .get .lab { color: var(--get-lab); }
.same { background: var(--same); border-left: 4px solid var(--same-edge); } .same .lab { color: var(--same-lab); }
.warn { background: var(--bad-soft); border-left: 4px solid var(--bad); } .warn .lab { color: var(--bad-lab); }
@media (max-width: 760px) { .box { padding: 14px 16px; } }
.notice { counter-reset: nc; list-style: none; padding: 0; margin: 4px 0 0; }
.notice li { position: relative; padding-left: 32px; margin-bottom: 9px; }
.notice li::before { counter-increment: nc; content: counter(nc); position: absolute; left: 0; top: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--rec-edge); color: #fff; font-family: var(--f-ui); font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; margin: 14px 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 15.5px; }
table.t th { background: var(--navy); color: var(--navy-ink); text-align: left; padding: 8px 10px; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; font-weight: 600; }
table.t td { padding: 8px 10px; border-bottom: 1px solid #E0E6EA; vertical-align: top; }
table.t tr:nth-child(even) td { background: var(--row); }
table.t td.k { font-weight: 700; color: var(--navy); }

/* ---------- pattern head ---------- */
.pat { border-top: 6px solid var(--navy); padding-top: 22px; margin-top: 64px; scroll-margin-top: 16px; }
.pnum { display: inline-block; background: var(--navy); color: var(--navy-ink); font-family: var(--f-ui); font-size: 14.5px; font-weight: 600; letter-spacing: 2px; padding: 6px 13px; text-transform: uppercase; }
.ptype { display: inline-block; font-family: var(--f-ui); font-size: 15.5px; color: var(--navy); font-weight: 600; margin-left: 18px; text-transform: uppercase; letter-spacing: .6px; }
.ptitle { font-family: var(--f-text); font-size: 25px; font-weight: 700; color: var(--navy); margin: 18px 0 0; line-height: 1.3; }
.minitoc { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; font-family: var(--f-ui); }
.minitoc .lbl2 { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--rec-lab); width: 100%; margin-top: 10px; }
.minitoc button { border: 1px solid var(--line); background: var(--page); color: var(--navy); padding: 4px 9px; font-size: 13px; font-weight: 600; min-width: 36px; }
.minitoc button.done { border-color: var(--ok); color: var(--ok); background: var(--get); }
.minitoc button:hover { border-color: var(--tech-edge); }
@media (max-width: 520px) { .ptype { display: block; margin: 10px 0 0; } .ptitle { font-size: 22px; } }

/* ---------- player ---------- */
.player { display: flex; gap: 14px; align-items: center; background: var(--page); border: 1px solid var(--rec-line); padding: 10px 12px; margin: 4px 0 12px; font-family: var(--f-ui); }
.pbtn { display: inline-flex; align-items: center; gap: 9px; background: var(--navy); color: var(--navy-ink); border: 0; padding: 9px 17px 9px 13px; font-weight: 600; font-size: 14.5px; letter-spacing: .5px; white-space: nowrap; }
.pbtn:disabled { opacity: .55; cursor: default; }
.pico { display: inline-block; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent currentColor; }
.player[data-state="playing"] .pico { width: 11px; height: 12px; border: 0; background: linear-gradient(90deg, currentColor 0 35%, transparent 35% 65%, currentColor 65% 100%); }
.player[data-state="played"] .pbtn { background: var(--qa); color: var(--navy); border: 1px solid var(--line); }
.pbody { flex: 1 1 auto; min-width: 0; }
.tape { height: 5px; background: var(--line); overflow: hidden; }
.tfill { height: 100%; width: 0; background: var(--rec-edge); transition: width .3s ease; }
.pmeta { font-size: 13px; color: var(--faint); margin-top: 6px; }
@media (max-width: 520px) { .player { flex-direction: column; align-items: stretch; } .pbtn { justify-content: center; } }

/* ---------- folds ---------- */
details.fold { border: 1px solid var(--line); background: var(--page); margin: 12px 0; }
details.fold > summary { cursor: pointer; padding: 10px 14px; font-family: var(--f-ui); font-size: 14.5px; font-weight: 700; color: var(--navy); list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--qa); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+"; width: 18px; height: 18px; border: 1px solid var(--navy); display: grid; place-items: center; font-size: 13px; color: var(--navy); flex: none; }
details.fold[open] > summary::before { content: "–"; }
details.fold > summary .hint { font-weight: 400; color: var(--faint); font-size: 13px; }
details.fold[open] > summary { border-bottom: 1px solid var(--line); }
details.fold.get { background: var(--get); border: 0; border-left: 4px solid var(--get-edge); }
details.fold.get > summary { color: var(--get-lab); background: transparent; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; }
details.fold.get > summary::before { border-color: var(--get-edge); color: var(--get-lab); }
.foldbody { padding: 12px 16px 14px; }
.legend { font-family: var(--f-ui); font-size: 13.5px; color: #555; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.tx p { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 1fr); gap: 12px; margin: 8px 0; }
.tx .spk { font-family: var(--f-ui); font-size: 12.5px; font-weight: 700; color: var(--faint); padding-top: 4px; overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: .5px; }
@media (max-width: 520px) { .tx p { grid-template-columns: 1fr; gap: 0; } }
mark { color: var(--ink); padding: 0 2px; }
mark.ev { background: var(--hA); } mark.para { background: var(--hP); } mark.trap { background: var(--hT); }
mark sup { font-family: var(--f-ui); font-size: 10px; font-weight: 700; margin-left: 2px; color: var(--muted); }

/* ---------- questions ---------- */
.group { margin: 26px 0 12px; }
.ginstr { font-family: var(--f-ui); margin-bottom: 10px; }
.grange { font-weight: 700; font-size: 15.5px; color: var(--navy); }
.ginstr p { margin: 2px 0; font-size: 14.5px; }
.ginstr .lim { color: var(--muted); }
.ginstr .lim b { color: var(--ink); }
.qsheet { border: 1px solid var(--line); padding: 16px 20px; background: var(--page); }
.qsheet .st { font-family: var(--f-ui); font-weight: 700; text-align: center; font-size: 15px; color: var(--navy); margin-bottom: 8px; }
.form { margin: 0; }
.frow { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px solid #E0E6EA; align-items: center; }
.frow:last-child { border-bottom: 0; }
.frow dt { color: var(--muted); font-size: 16px; } .frow dd { margin: 0; min-width: 0; }
.qsheet h4 { font-family: var(--f-ui); font-size: 14px; font-weight: 700; margin: 12px 0 4px; color: var(--navy); }
.qsheet .np { margin: 4px 0; padding-left: 16px; position: relative; }
.qsheet .np::before { content: ""; position: absolute; left: 3px; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.gaps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; }
.flow li { position: relative; border: 1px solid var(--navy); padding: 9px 12px; margin: 0; }
.flow li + li::before { content: ""; position: absolute; left: 50%; top: -19px; width: 1.5px; height: 12px; background: var(--navy); }
.flow li + li::after { content: ""; position: absolute; left: calc(50% - 5px); top: -9px; border: 5px solid transparent; border-top-color: var(--navy); }
table.qt { width: 100%; border-collapse: collapse; font-size: 15.5px; min-width: 520px; }
table.qt th, table.qt td { border: 1px solid var(--line); padding: 8px 9px; text-align: left; vertical-align: top; }
table.qt th { font-family: var(--f-ui); font-size: 12.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.slot { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 2px; max-width: 100%; }
.slot .qn { font-family: var(--f-ui); font-size: 13px; font-weight: 700; color: var(--qn); padding: 0 5px 0 2px; display: grid; place-items: center; }
.gap { font-family: var(--f-ui); font-size: 15.5px; color: var(--ink); background: var(--qa); border: 0; border-bottom: 1.5px solid var(--navy); padding: 2px 6px; width: 9.5em; max-width: 48vw; border-radius: 0; }
.gap:focus { outline: none; background: var(--tech); border-bottom-color: var(--tech-edge); }
.gap:disabled { opacity: .85; }
.qblock { margin: 16px 0; }
.stem { margin: 0 0 6px; font-weight: 700; color: var(--navy); }
.stem .qn, .sel .qn { font-family: var(--f-ui); font-weight: 700; color: var(--qn); margin-right: 8px; }
.opts { display: grid; gap: 4px; padding-left: 24px; }
.opt { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 9px; align-items: baseline; padding: 4px 8px; cursor: pointer; }
.opt:hover { background: var(--qa); }
.opt input { accent-color: var(--navy); margin: 0; transform: translateY(2px); }
.opt .L { font-family: var(--f-ui); font-weight: 700; color: var(--navy); }
.opt:has(input:checked) { background: var(--tech); }
.hint2 { color: var(--bad); font-size: 13.5px; font-family: var(--f-ui); margin: 4px 0 0 24px; }
.hint2:empty { display: none; }
.mapwrap { border: 1px solid var(--line); padding: 8px; overflow-x: auto; background: var(--page); }
.map { display: block; width: 100%; max-width: 620px; height: auto; margin: 0 auto; }
.m-ground { fill: var(--m-ground); stroke: var(--line); }
.m-path { fill: none; stroke: var(--m-path); stroke-width: 14; stroke-linecap: round; }
.m-yard { fill: var(--m-yard); stroke: var(--m-path); }
.m-land { fill: var(--m-bld); stroke: var(--muted); stroke-dasharray: 3 3; }
.m-water { fill: var(--m-water); } .m-gate { fill: var(--muted); }
.m-lab { font-family: var(--f-ui); font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
.m-pin rect { fill: var(--m-bld); stroke: var(--navy); stroke-width: 1.5; }
.m-pin text { font-family: var(--f-ui); font-size: 14px; font-weight: 700; fill: var(--navy); text-anchor: middle; }
.m-compass path { fill: var(--muted); } .m-compass text { font-family: var(--f-ui); font-size: 11px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
.sels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 14px; margin-top: 10px; }
.sel { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #E0E6EA; }
.sel label { min-width: 0; }
.optbox { border: 1px solid var(--line); border-left: 4px solid var(--navy); background: var(--qa); padding: 10px 14px; display: grid; gap: 2px; font-size: 16px; margin-bottom: 8px; }
.optbox .obt { font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: var(--navy); margin-bottom: 4px; }
.optbox b { font-family: var(--f-ui); margin-right: 8px; }

/* ---------- answer folds (PDF question + answer card) ---------- */
.afolds { display: grid; gap: 6px; margin-top: 12px; }
details.ans { border: 1px solid var(--line); background: var(--page); }
details.ans > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-family: var(--f-ui); font-size: 14px; background: var(--qa); }
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary .qn { font-weight: 700; color: var(--qn); min-width: 44px; }
details.ans > summary .peek { color: var(--navy); font-weight: 700; }
details.ans[open] > summary .peek::after { content: " ▴"; } details.ans:not([open]) > summary .peek::after { content: " ▾"; }
details.ans > summary .res { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .4px; padding: 1px 8px; }
.res:empty { display: none; }
.res.r-ok { background: var(--ok-soft); color: var(--ok); } .res.r-bad { background: var(--bad-soft); color: var(--bad); } .res.r-mid { background: var(--warn-soft); color: var(--warn); }
.abody { padding: 4px 16px 12px; border-top: 1px solid var(--line); }
.abig { display: inline-block; background: var(--ok); color: #fff; font-family: var(--f-ui); font-size: 15px; font-weight: 700; letter-spacing: .8px; padding: 2px 10px; margin: 10px 0 6px; }
.alsos { font-family: var(--f-ui); font-size: 13px; color: var(--faint); margin-left: 8px; }
.yours { font-family: var(--f-ui); font-size: 13.5px; margin: 4px 0 6px; }
.yours.r-ok { color: var(--ok); } .yours.r-bad { color: var(--bad); } .yours.r-mid { color: var(--warn); }
.wt { display: block; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: 1px; font-weight: 700; color: var(--faint); text-transform: uppercase; margin-top: 8px; }
.abody p { margin: 2px 0 6px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--tech-edge); font-family: var(--f-ui); font-size: 13.5px; font-weight: 700; text-align: left; }

/* ---------- buttons / actions ---------- */
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0; font-family: var(--f-ui); }
.primary { background: var(--navy); color: var(--navy-ink); border: 1px solid var(--navy); padding: 9px 16px; font-weight: 600; font-size: 14.5px; letter-spacing: .4px; }
.ghost { background: var(--page); color: var(--navy); border: 1px solid var(--line); padding: 9px 14px; font-size: 14.5px; font-weight: 600; }
.ghost:hover { border-color: var(--navy); }
.danger { background: var(--bad); color: #fff; border: 1px solid var(--bad); padding: 8px 14px; font-weight: 600; }
.sm { padding: 6px 12px; font-size: 13.5px; }
.confirm { background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 12px 14px; font-family: var(--f-ui); font-size: 14.5px; }

/* ---------- full test ---------- */
.exam { border: 1px solid var(--line); border-top: 6px solid var(--navy); padding: 20px 24px; margin: 26px 0; background: var(--page); scroll-margin-top: 16px; }
.exam .eh { font-family: var(--f-ui); font-weight: 700; font-size: 17px; color: var(--navy); margin: 0; letter-spacing: .4px; text-transform: uppercase; }
.exam .es { font-style: italic; color: var(--muted); margin: 4px 0 12px; font-size: 16px; }
@media (max-width: 520px) { .exam { padding: 14px 12px; } }
.result { border: 1px solid var(--line); border-left: 4px solid var(--navy); background: var(--qa); padding: 16px 20px; margin: 10px 0 22px; display: grid; gap: 12px; font-family: var(--f-ui); }

<!-- ============================================================ PART 1 · TECHNIQUE -->
<template id="tpl-technique">
<div class="sheetpage">
<div class="partdiv"><div class="kick">Part 1</div><h1>Listening Technique</h1>
<p>How the test is built, what to do in the reading time, and the five steps that apply to every question. Everything in Parts 2 and 3 assumes this.</p></div>

<h2>1. How the test works</h2>
<div class="tablewrap"><table class="t">
  <tr><th>Part</th><th>What you hear</th><th>Typical questions</th></tr>
  <tr><td class="k">Part 1</td><td>A conversation between two people in an everyday situation: booking, enquiring, registering</td><td>Form and note completion: names, numbers, dates</td></tr>
  <tr><td class="k">Part 2</td><td>One person on an everyday topic: a tour, a talk, an announcement</td><td>Maps and plans, multiple choice, matching, short answers</td></tr>
  <tr><td class="k">Part 3</td><td>Up to four people discussing study: students, sometimes with a tutor</td><td>Multiple choice, matching opinions, choose TWO, flow-charts</td></tr>
  <tr><td class="k">Part 4</td><td>One academic lecture with no break in the middle</td><td>Note, table or sentence completion, usually ten gaps in a row</td></tr>
</table></div>
<p><b>Forty questions, one mark each.</b> The recordings last about thirty minutes and you hear each one <b>once only</b>. On paper you then get ten minutes to transfer your answers; on computer you get two minutes to check. The test is the same for Academic and General Training, and it gets harder part by part.</p>

<h2>2. The reading time before each recording</h2>
<p>Before every section there are about thirty seconds to read the questions. This is where the marks are won. In that time:</p>
<ol>
<li><b>Underline the key words</b> in each question, and expect to hear them reworded.</li>
<li><b>Predict the type of answer</b> for every gap: a number, a name, a plural noun, an adjective.</li>
<li><b>Note the word limit.</b> ONE WORD ONLY and ONE WORD AND/OR A NUMBER are different rules.</li>
<li><b>Look at how the questions are grouped</b>, so you know when the speaker moves from one group to the next.</li>
</ol>

<h2>3. The five steps for every question</h2>
<div class="box tech"><span class="lab">The procedure</span>
<ol>
<li><b>Read and predict.</b> Decide what kind of word you are waiting for before the speaker reaches it.</li>
<li><b>Expect rewording.</b> The question will almost never use the speaker's words. Listen for the meaning.</li>
<li><b>Follow the signposts.</b> <i>First, next, the main reason, moving on</i> tell you which question you are on.</li>
<li><b>Wait for the speaker to settle.</b> The first answer you hear is often corrected, rejected or overtaken.</li>
<li><b>Check the form.</b> Spelling, plural, word limit, and no repeated printed words.</li>
</ol></div>
<p>Step 4 is the one that separates a 7 from a 9. Most mistakes in Listening are not mishearing; they are writing too early.</p>

<h2>4. Predict the answer before you hear it</h2>
<p>Choose the type of word each gap needs.</p>
<div id="m-predict"></div>

<h2>5. Signpost words tell you where you are</h2>
<p>Match each signpost to its job.</p>
<div id="m-sign"></div>

<h2>6. Letters and numbers</h2>
<p>Part 1 nearly always tests spelling and numbers. Zero is often said as <i>oh</i>, repeated digits as <i>double</i>, and the letters that sound alike are the ones you will be given. Press play, type what you hear, then check.</p>
<div id="m-dict"></div>

<h2>7. The recording never uses the question's words</h2>
<p>This is the whole game, exactly as in Reading. The question is a reworded version of what the speaker says, and it gets reworded in a few predictable ways:</p>
<div class="tablewrap"><table class="t">
  <tr><th>Type</th><th>You hear</th><th>The question says</th></tr>
  <tr><td class="k">A different word</td><td>"the session is cancelled"</td><td>the session will not take place</td></tr>
  <tr><td class="k">An idiom</td><td>"it won't cost the earth"</td><td>it is cheap</td></tr>
  <tr><td class="k">A description</td><td>"where we can reach you"</td><td>phone number</td></tr>
  <tr><td class="k">The opposite, negated</td><td>"hardly anyone complained"</td><td>not a problem</td></tr>
  <tr><td class="k">Examples become a category</td><td>"swimming, squash and tennis"</td><td>sports</td></tr>
  <tr><td class="k">The same fact from the other end</td><td>"open until late"</td><td>closing time</td></tr>
</table></div>

<h2>8. Distractors: the first answer is often wrong</h2>
<div class="tablewrap"><table class="t">
  <tr><th>Shape</th><th>Example</th></tr>
  <tr><td class="k">Correction</td><td>"Tuesday. No, sorry, Thursday."</td></tr>
  <tr><td class="k">Rejection</td><td>"I did consider the gold membership, but…"</td></tr>
  <tr><td class="k">Past vs now</td><td>"It used to be at eight; now it's half past."</td></tr>
  <tr><td class="k">Expectation vs reality</td><td>"I expected her to be defensive, but she was really keen."</td></tr>
  <tr><td class="k">Popular belief</td><td>"Many people think X. In fact…"</td></tr>
  <tr><td class="k">The other speaker</td><td>The question asks about Nadia; Tom speaks first.</td></tr>
</table></div>
<p>Try one. Listen, answer, then open the answer.</p>
<div id="m-distr"></div>

<h2>9. Word limits and the answer sheet</h2>
<p>An answer can be completely right and still score zero because of how it is written. Decide whether each answer is acceptable.</p>
<div id="m-lim"></div>
<div class="box warn"><span class="lab">Rules that cost marks before anyone checks your listening</span>
<p>Spell correctly (British or American spelling are both accepted). Keep plurals as you hear them. Never repeat a word printed beside the gap. Write numbers in figures. Capitals do not matter. Never leave a blank: there is no penalty for a wrong answer.</p></div>

<h2>10. How to use Part 3</h2>
<p>Each of the 24 patterns is laid out the same way:</p>
<div class="tablewrap"><table class="t">
  <tr><td class="k" style="width:210px">TECHNIQUE</td><td>How to listen for this question type, in a few lines.</td></tr>
  <tr><td class="k">THE RECORDING</td><td>Press play. The transcript is folded underneath: open it after you have listened.</td></tr>
  <tr><td class="k">WHAT YOU SHOULD GET</td><td>Numbered notes explaining each highlight: why it matters and what it tells you.</td></tr>
  <tr><td class="k">QUESTION → ANSWER</td><td>The question, with the answer and the reason folded directly underneath.</td></tr>
  <tr><td class="k">SAME PATTERN NEXT TIME</td><td>The rule to carry into the real test.</td></tr>
</table></div>
<p class="legend"><span><mark class="ev">yellow</mark> the line that answers the question</span><span><mark class="para">green</mark> the reworded link between recording and question</span><span><mark class="trap">pink</mark> the trap</span></p>
<div class="actions"><button type="button" class="primary" data-go="test">Next: Part 2, the full test →</button></div>
</div>
</template>

<!-- ============================================================ TOOLKIT -->
<template id="tpl-toolkit">
<div class="sheetpage">
<div class="partdiv"><div class="kick">Part 4</div><h1>Toolkit</h1>
<p>The letters, numbers, spellings and signposts the test keeps using. For practice and for the last week.</p></div>
<h2>Letters that sound alike</h2>
<div class="tablewrap"><table class="t">
  <tr><th>Group</th><th>How to tell them apart</th></tr>
  <tr><td class="k">A · E · I</td><td>A rhymes with day, E with see, I with eye. Speakers often confirm: "E as in echo".</td></tr>
  <tr><td class="k">G · J</td><td>G rhymes with see, J with day. The most confused pair in Part 1.</td></tr>
  <tr><td class="k">B · P · V · D · T</td><td>All rhyme with see. Listen for the confirmation word.</td></tr>
  <tr><td class="k">M · N</td><td>Very close on a recording. Expect "M for mother" or similar.</td></tr>
  <tr><td class="k">S · F</td><td>Both begin with an "e" sound: "ess" and "eff".</td></tr>
  <tr><td class="k">Double letters</td><td>"Double O", "double L": write two.</td></tr>
</table></div>
<h2>Numbers, times and dates</h2>
<div class="tablewrap"><table class="t">
  <tr><th>You hear</th><th>You write</th></tr>
  <tr><td class="k">oh seven seven</td><td>077</td></tr>
  <tr><td class="k">double five</td><td>55</td></tr>
  <tr><td class="k">fif-TEEN / FIF-ty</td><td>15 / 50: stress on the end for -teen, on the start for -ty</td></tr>
  <tr><td class="k">half past eleven</td><td>11.30</td></tr>
  <tr><td class="k">quarter to three</td><td>2.45</td></tr>
  <tr><td class="k">eight pounds fifty</td><td>8.50 (with £ printed)</td></tr>
  <tr><td class="k">the fifth of May</td><td>5 May · May 5 · 5th May (all accepted)</td></tr>
</table></div>
<h2>Words people misspell in the test</h2>
<div class="words">
  <span>accommodation</span><span>address</span><span>appointment</span><span>beginning</span><span>business</span><span>calendar</span>
  <span>colleague</span><span>committee</span><span>comfortable</span><span>definitely</span><span>environment</span><span>equipment</span>
  <span>February</span><span>Wednesday</span><span>government</span><span>guarantee</span><span>library</span><span>necessary</span>
  <span>opportunity</span><span>questionnaire</span><span>receipt</span><span>recommend</span><span>restaurant</span><span>schedule</span>
  <span>separate</span><span>souvenir</span><span>temperature</span><span>tomorrow</span><span>vegetable</span><span>laboratory</span>
  <span>experiment</span><span>advertisement</span><span>conference</span><span>convenient</span><span>independent</span><span>knowledge</span>
  <span>leisure</span><span>museum</span><span>occasionally</span><span>parliament</span>
</div>
<p class="small faint" style="margin-top:10px">British and American spellings are both accepted: centre / center, programme / program, travelling / traveling.</p>
<h2>Signpost words</h2>
<div class="tablewrap"><table class="t">
  <tr><th>Job</th><th>Words</th></tr>
  <tr><td class="k">Sequence</td><td>first, to begin with, next, after that, a second factor, finally</td></tr>
  <tr><td class="k">Key point</td><td>the main reason, the most important thing, above all, what I'd really stress</td></tr>
  <tr><td class="k">Contrast</td><td>however, but, on the other hand, actually, in fact</td></tr>
  <tr><td class="k">Correction</td><td>sorry, I mean, no wait, actually, it's been changed</td></tr>
  <tr><td class="k">Rejection</td><td>I did consider, it used to, we won't need, that's sorted</td></tr>
  <tr><td class="k">Agreement</td><td>exactly, agreed, me too, definitely, has to go in</td></tr>
  <tr><td class="k">Conclusion</td><td>so, to sum up, overall, in short</td></tr>
</table></div>
<h2>Raw score to band</h2>
<div class="tablewrap"><table class="t">
  <tr><th>Correct out of 40</th><th>Band (indicative)</th></tr>
  <tr><td class="k">39–40</td><td>9.0</td></tr><tr><td class="k">37–38</td><td>8.5</td></tr><tr><td class="k">35–36</td><td>8.0</td></tr>
  <tr><td class="k">32–34</td><td>7.5</td></tr><tr><td class="k">30–31</td><td>7.0</td></tr><tr><td class="k">26–29</td><td>6.5</td></tr><tr><td class="k">23–25</td><td>6.0</td></tr>
</table></div>
<p class="small faint">The conversion varies slightly between test versions. Band 9 allows at most one mistake.</p>
</div>
